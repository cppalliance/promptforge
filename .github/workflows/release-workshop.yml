name: Release Workshop
run-name: PromptForge Workshop ${{ github.ref_name }}

# Builds the PromptForge Workshop desktop installers for Windows, macOS
# (ARM and Intel), and Linux on a workshop-v* tag, tests each
# installer on a clean machine of the same kind, and publishes one GitHub
# Release with all five installers and a SHA256SUMS file. A failed test
# means no release.
#
# Platform code signing is still absent. Tauri updater bundles are signed
# independently with the release minisign key.

on:
  push:
    tags:
      - "workshop-v**[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-workshop-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # GitHub expressions have no .replace(); shell steps extract the version.
  TAG_NAME: ${{ github.ref_name }}
  # The repo's rust-toolchain.toml pins the MSRV for local builds; CI tests
  # the current stable.
  RUSTUP_TOOLCHAIN: stable

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: windows-latest
            args: ""
          - name: macos-arm
            runs-on: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - name: macos-intel
            runs-on: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
          - name: linux
            runs-on: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Add the Rust target
        if: matrix.name != 'windows' && matrix.name != 'linux'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: crates/workshop-server/ui
        run: npm ci

      - name: Install config UI dependencies
        working-directory: crates/gateway-config-ui/ui
        run: npm ci

      - name: Install Tauri system packages
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # SIGNING (Windows): import the Authenticode certificate here once an
      # EV/OV cert exists; tauri-action picks it up from the machine store.
      # SIGNING (macOS): import the Developer ID certificate and pass
      # APPLE_CERTIFICATE/APPLE_SIGNING_IDENTITY to tauri-action's env.

      - name: Build the app
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/workshop
          args: ${{ matrix.args }}

      - name: The built version matches the tag
        shell: bash
        run: |
          version="${TAG_NAME#workshop-v}"
          built="${{ steps.build.outputs.appVersion }}"
          if [ "$built" != "$version" ]; then
            echo "tag version $version does not match the crate version $built"
            exit 1
          fi

      - name: Give macOS updater bundles architecture-specific names
        if: matrix.name == 'macos-arm' || matrix.name == 'macos-intel'
        shell: bash
        run: |
          version="${TAG_NAME#workshop-v}"
          if [[ "${{ matrix.name }}" == "macos-arm" ]]; then
            arch="aarch64"
          else
            arch="x86_64"
          fi
          bundle=$(find target -path "*/bundle/macos/*.app.tar.gz" | head -1)
          [ -n "$bundle" ] || { echo "no macOS updater bundle"; exit 1; }
          renamed="$(dirname "$bundle")/PromptForge_${version}_${arch}.app.tar.gz"
          mv "$bundle" "$renamed"
          mv "$bundle.sig" "$renamed.sig"

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: workshop-${{ matrix.name }}
          path: |
            target/**/bundle/nsis/*.exe
            target/**/bundle/dmg/*.dmg
            target/**/bundle/deb/*.deb
            target/**/bundle/appimage/*.AppImage
            target/**/bundle/**/*.sig
            target/**/bundle/macos/*.app.tar.gz
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: windows-latest
          - name: macos-arm
            runs-on: macos-latest
          - name: macos-intel
            runs-on: macos-15-intel
          - name: linux
            runs-on: ubuntu-22.04
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          name: workshop-${{ matrix.name }}
          path: dist

      - name: Install and check (Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          $setup = Get-ChildItem -Recurse dist -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer in the artifact" }
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = @("$env:LOCALAPPDATA", "$env:ProgramFiles", "${env:ProgramFiles(x86)}") |
            ForEach-Object { Get-ChildItem $_ -Recurse -Filter *.exe -ErrorAction SilentlyContinue } |
            Where-Object { $_.Name -in @("PromptForge.exe", "workshop.exe") } |
            Select-Object -First 1
          if (-not $exe) { throw "PromptForge.exe not found after install" }
          $output = & $exe.FullName --version | Out-String
          $version = $env:TAG_NAME -replace '^workshop-v', ''
          if ($output -notmatch [regex]::Escape($version)) { throw "--version printed '$output', expected $version" }
          $output
          $configDir = Join-Path $env:USERPROFILE ".promptforge"
          New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          @'
          config-version = 2
          [server]
          bind = "127.0.0.1:8081"
          api_key = "release-smoke"
          [workshop]
          bind = "127.0.0.1:7910"
          [[profile]]
          name = "default"
          models = []
          '@ | Set-Content (Join-Path $configDir "gateway.toml")
          Start-Process $exe.FullName
          $page = $null
          foreach ($i in 1..60) {
            try { $page = Invoke-WebRequest -Uri "http://127.0.0.1:7910/" -UseBasicParsing -TimeoutSec 2; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $page) { throw "the workshop page never answered" }
          if ($page.Content -notmatch "<title>PromptForge</title>") { throw "unexpected workshop page content" }
          $js = Invoke-WebRequest -Uri "http://127.0.0.1:7910/app.js" -UseBasicParsing
          # The current minified workbench is about 2.5 MB.
          if ($js.RawContentLength -gt 3000000) { throw "app.js is unexpectedly large ($($js.RawContentLength) bytes)" }
          Get-Process PromptForge -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Install and check (macOS)
        if: matrix.name == 'macos-arm' || matrix.name == 'macos-intel'
        run: |
          set -e
          dmg=$(find dist -name "*.dmg" | head -1)
          [ -n "$dmg" ] || { echo "no DMG in the artifact"; exit 1; }
          hdiutil attach "$dmg" -nobrowse -quiet
          cp -R "/Volumes/PromptForge/PromptForge.app" /tmp/PromptForge.app
          hdiutil detach "/Volumes/PromptForge" -quiet
          bin=$(find /tmp/PromptForge.app/Contents/MacOS -type f | head -1)
          version="${TAG_NAME#workshop-v}"
          output=$("$bin" --version)
          echo "$output" | grep -F "$version"
          mkdir -p "$HOME/.promptforge"
          cat > "$HOME/.promptforge/gateway.toml" <<'EOF'
          config-version = 2
          [server]
          bind = "127.0.0.1:8081"
          api_key = "release-smoke"
          [workshop]
          bind = "127.0.0.1:7910"
          [[profile]]
          name = "default"
          models = []
          EOF
          "$bin" &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:7910/ -o /tmp/workshop.html; then break; fi
            sleep 1
          done
          grep -F "<title>PromptForge</title>" /tmp/workshop.html
          size=$(curl -sf http://127.0.0.1:7910/app.js | wc -c)
          # The current minified workbench is about 2.5 MB.
          [ "$size" -lt 3000000 ] || { echo "app.js is unexpectedly large ($size bytes)"; exit 1; }

      - name: Install and check (Linux)
        if: matrix.name == 'linux'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y xvfb
          deb=$(find dist -name "*.deb" | head -1)
          [ -n "$deb" ] || { echo "no deb in the artifact"; exit 1; }
          sudo dpkg -i "$deb" || sudo apt-get install -f -y
          package=$(dpkg-deb -f "$deb" Package)
          bin=$(dpkg -L "$package" | grep -E '/usr/bin/[^/]+$' | head -1)
          [ -n "$bin" ] || { echo "no binary in the deb"; exit 1; }
          version="${TAG_NAME#workshop-v}"
          output=$("$bin" --version)
          echo "$output" | grep -F "$version"
          # The AppImage is not installed; check it exists and runs --version.
          appimage=$(find dist -name "*.AppImage" | head -1)
          [ -n "$appimage" ] || { echo "no AppImage in the artifact"; exit 1; }
          chmod +x "$appimage"
          "$appimage" --version | grep -F "$version"
          mkdir -p "$HOME/.promptforge"
          cat > "$HOME/.promptforge/gateway.toml" <<'EOF'
          config-version = 2
          [server]
          bind = "127.0.0.1:8081"
          api_key = "release-smoke"
          [workshop]
          bind = "127.0.0.1:7910"
          [[profile]]
          name = "default"
          models = []
          EOF
          xvfb-run -a "$bin" &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:7910/ -o /tmp/workshop.html; then break; fi
            sleep 1
          done
          grep -F "<title>PromptForge</title>" /tmp/workshop.html
          size=$(curl -sf http://127.0.0.1:7910/app.js | wc -c)
          # The current minified workbench is about 2.5 MB.
          [ "$size" -lt 3000000 ] || { echo "app.js is unexpectedly large ($size bytes)"; exit 1; }
          pkill -f "$(basename "$bin")" || true

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download every installer's artifact
        uses: actions/download-artifact@v4
        with:
          pattern: workshop-*
          path: dist

      - name: SHA256SUMS
        working-directory: dist
        run: |
          shopt -s globstar nullglob
          files=(**/*.exe **/*.dmg **/*.deb **/*.AppImage **/*.app.tar.gz)
          for file in "${files[@]}"; do
            digest=$(sha256sum "$file" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$digest" "$(basename "$file")"
          done | sort -k 2 > SHA256SUMS
          cat SHA256SUMS

      - name: Assemble latest.json
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          root = Path("dist")
          tag = os.environ["TAG_NAME"]
          version = tag.removeprefix("workshop-v")
          repository = os.environ["GITHUB_REPOSITORY"]
          platforms = {}
          for platform, artifact, pattern in [
              ("windows-x86_64", "workshop-windows", "*-setup.exe.sig"),
              ("darwin-aarch64", "workshop-macos-arm", "*.app.tar.gz.sig"),
              ("darwin-x86_64", "workshop-macos-intel", "*.app.tar.gz.sig"),
              ("linux-x86_64", "workshop-linux", "*.AppImage.sig"),
          ]:
              folder = root / artifact
              signed = [
                  (Path(str(signature)[:-4]), signature)
                  for signature in folder.rglob(pattern)
                  if Path(str(signature)[:-4]).is_file()
              ]
              if len(signed) != 1:
                  names = ", ".join(str(path) for path, _ in signed)
                  raise SystemExit(f"{artifact} has {len(signed)} signed updater bundles: {names}")
              bundle, signature = signed[0]
              asset = bundle.name
              platforms[platform] = {
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{quote(asset)}",
                  "signature": signature.read_text(encoding="utf-8").strip(),
              }

          manifest = {
              "version": version,
              "notes": f"PromptForge Workshop {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          (root / "latest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python3 -m json.tool dist/latest.json

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PromptForge Workshop ${{ github.ref_name }}
          make_latest: true
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.sig
            dist/**/*.app.tar.gz
            dist/SHA256SUMS
            dist/latest.json

      - name: Stage version-free installer names
        shell: bash
        run: |
          set -e
          # Copies, not moves, staged after "Publish the release": the
          # versioned release keeps its versioned asset names, and the
          # evergreen names live only on the rolling latest release.
          mkdir -p dist/evergreen
          copy_one() {
            local pattern="$1" target="$2"
            local source
            source=$(find dist -path "*/$pattern" | head -1)
            [ -n "$source" ] || { echo "no installer matches $pattern"; exit 1; }
            cp "$source" "dist/evergreen/$target"
          }
          copy_one "workshop-windows/*-setup.exe" PromptForge-setup.exe
          copy_one "workshop-macos-arm/*.dmg" PromptForge-arm64.dmg
          copy_one "workshop-macos-intel/*.dmg" PromptForge-x64.dmg
          copy_one "workshop-linux/*.deb" PromptForge.deb
          copy_one "workshop-linux/*.AppImage" PromptForge.AppImage
          ls -l dist/evergreen

      - name: Publish the stable updater pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view workshop-latest >/dev/null 2>&1; then
            gh release upload workshop-latest \
              dist/latest.json dist/evergreen/* --clobber
          else
            gh release create workshop-latest \
              --target "$GITHUB_SHA" \
              --title "PromptForge Workshop updater" \
              --notes "Stable updater manifest for the latest tested Workshop release." \
              --latest=false \
              dist/latest.json dist/evergreen/*
          fi
