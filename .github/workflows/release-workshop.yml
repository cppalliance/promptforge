name: Release Workshop
run-name: PromptForge Workshop ${{ github.event_name == 'workflow_dispatch' && 'nonpublishing' || github.ref_name }}

# Builds the PromptForge Workshop desktop installers for Windows, macOS
# (ARM and Intel), and Linux (x86_64 and ARM64) on a workshop-v* tag,
# tests each installer on a clean machine of the same kind, and publishes
# one GitHub Release with all seven installers and a SHA256SUMS file.
# A failed test means no release.
#
# A manual run builds and tests the same unsigned installer matrix as
# temporary workflow artifacts. It can never reach the publish job.
#
# Platform code signing is still absent. Tauri updater bundles are signed
# independently with the release minisign key.

on:
  push:
    tags:
      - "workshop-v**[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-workshop-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      execution-sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Report the execution identity
        id: identity
        shell: bash
        run: |
          set -e
          sha=$(git rev-parse HEAD)
          [ "$sha" = "$GITHUB_SHA" ] || { echo "checkout $sha does not match event SHA $GITHUB_SHA"; exit 1; }
          version=$(python3 - <<'PY'
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              print(tomllib.load(manifest)["workspace"]["package"]["version"])
          PY
          )
          [ "$version" = "0.3.0" ] || { echo "workspace version is $version, expected 0.3.0"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#workshop-v}"
            [ "$tag_version" = "$version" ] || { echo "tag version $tag_version does not match workspace version $version"; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "Execution SHA: $sha"
            echo "Workspace version: $version"
            echo "Mode: $GITHUB_EVENT_NAME"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: windows-latest
            args: ""
          - name: macos-arm
            runs-on: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - name: macos-intel
            runs-on: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
          - name: linux
            runs-on: ubuntu-22.04
            args: ""
          - name: linux-arm
            runs-on: ubuntu-22.04-arm
            args: ""
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.execution-sha }}

      - name: Report the execution SHA
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          expected="${{ needs.prepare.outputs.execution-sha }}"
          [ "$actual" = "$expected" ] || { echo "checkout $actual does not match execution SHA $expected"; exit 1; }
          echo "Execution SHA: $actual"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Add the Rust target
        if: matrix.name == 'macos-arm' || matrix.name == 'macos-intel'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/*/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: crates/workshop-server/ui
        run: npm ci

      # The gateway sidecar build needs the config UI's esbuild pipeline
      # (default `config-ui` feature) and the embedding model that
      # promptforge-tool-picker's build script compiles in.
      - name: Install config UI dependencies
        working-directory: crates/gateway-config-ui/ui
        run: npm ci

      - name: Cache the embedding model
        uses: ./.github/actions/hf-model-cache

      - name: Install Tauri system packages
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          # xdg-utils: the AppImage bundler shells out to xdg-open, which the
          # ARM runner images do not preinstall (the x64 image does).
          # https://github.com/tauri-apps/tauri-action/issues/1319
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev xdg-utils

      # SIGNING (Windows): import the Authenticode certificate here once an
      # EV/OV cert exists; tauri-action picks it up from the machine store.
      # SIGNING (macOS): import the Developer ID certificate and pass
      # APPLE_CERTIFICATE/APPLE_SIGNING_IDENTITY to tauri-action's env.

      # tauri.conf.json ships the gateway via bundle.externalBin, which
      # resolves binaries/promptforge-gateway-<target-triple> at bundle
      # time; build and stage it before tauri-action runs.
      - name: Build and stage the gateway sidecar
        shell: bash
        run: |
          set -e
          case "${{ matrix.name }}" in
            windows)     triple="x86_64-pc-windows-msvc";  ext=".exe" ;;
            macos-arm)   triple="aarch64-apple-darwin";    ext="" ;;
            macos-intel) triple="x86_64-apple-darwin";     ext="" ;;
            linux)       triple="x86_64-unknown-linux-gnu"; ext="" ;;
            linux-arm)   triple="aarch64-unknown-linux-gnu"; ext="" ;;
          esac
          case "${{ matrix.args }}" in
            *--target*)
              cargo build --release --locked -p gateway --target "$triple"
              src="target/$triple/release/promptforge-gateway$ext"
              ;;
            *)
              cargo build --release --locked -p gateway
              src="target/release/promptforge-gateway$ext"
              ;;
          esac
          mkdir -p crates/workshop/binaries
          staged="crates/workshop/binaries/promptforge-gateway-$triple$ext"
          cp "$src" "$staged"
          output=$("$staged" --version)
          version="${{ needs.prepare.outputs.version }}"
          expected="promptforge-gateway $version"
          [ "$output" = "$expected" ] || { echo "staged Gateway printed '$output', expected '$expected'"; exit 1; }

      - name: Build the signed release app
        if: github.event_name == 'push'
        id: release-build
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/workshop
          args: ${{ matrix.args }}

      - name: Build the unsigned temporary app
        if: github.event_name == 'workflow_dispatch'
        id: temporary-build
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/workshop
          args: ${{ matrix.args }} --config tauri.nightly.conf.json

      - name: The signed build has the workspace version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          built="${{ steps.release-build.outputs.appVersion }}"
          if [ "$built" != "$version" ]; then
            echo "workspace version $version does not match the crate version $built"
            exit 1
          fi

      - name: The temporary build has the workspace version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          built="${{ steps.temporary-build.outputs.appVersion }}"
          if [ "$built" != "$version" ]; then
            echo "workspace version $version does not match the crate version $built"
            exit 1
          fi

      - name: Give macOS updater bundles architecture-specific names
        if: github.event_name == 'push' && (matrix.name == 'macos-arm' || matrix.name == 'macos-intel')
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          if [[ "${{ matrix.name }}" == "macos-arm" ]]; then
            arch="aarch64"
          else
            arch="x86_64"
          fi
          bundle=$(find target -path "*/bundle/macos/*.app.tar.gz" | head -1)
          [ -n "$bundle" ] || { echo "no macOS updater bundle"; exit 1; }
          renamed="$(dirname "$bundle")/PromptForge_${version}_${arch}.app.tar.gz"
          mv "$bundle" "$renamed"
          mv "$bundle.sig" "$renamed.sig"

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: workshop-${{ matrix.name }}
          path: |
            target/**/bundle/nsis/*.exe
            target/**/bundle/dmg/*.dmg
            target/**/bundle/deb/*.deb
            target/**/bundle/appimage/*.AppImage
            target/**/bundle/**/*.sig
            target/**/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 7

  test:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: windows-latest
          - name: macos-arm
            runs-on: macos-latest
          - name: macos-intel
            runs-on: macos-15-intel
          - name: linux
            runs-on: ubuntu-22.04
          - name: linux-arm
            runs-on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.execution-sha }}

      - name: Report the execution SHA
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          expected="${{ needs.prepare.outputs.execution-sha }}"
          [ "$actual" = "$expected" ] || { echo "checkout $actual does not match execution SHA $expected"; exit 1; }
          echo "Execution SHA: $actual"

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          name: workshop-${{ matrix.name }}
          path: dist

      - name: Install and check (Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          $setup = Get-ChildItem -Recurse dist -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer in the artifact" }
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = @("$env:LOCALAPPDATA", "$env:ProgramFiles", "${env:ProgramFiles(x86)}") |
            ForEach-Object { Get-ChildItem $_ -Recurse -Filter *.exe -ErrorAction SilentlyContinue } |
            Where-Object { $_.Name -in @("promptforge-workshop.exe") } |
            Select-Object -First 1
          if (-not $exe) { throw "promptforge-workshop.exe not found after install" }
          # The gateway ships as an externalBin sidecar; a default (all
          # components checked) silent install must lay it beside the shell.
          $gateway = @("$env:LOCALAPPDATA", "$env:ProgramFiles", "${env:ProgramFiles(x86)}") |
            ForEach-Object { Get-ChildItem $_ -Recurse -Filter promptforge-gateway.exe -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $gateway) { throw "promptforge-gateway.exe not found after install" }
          $output = (& $exe.FullName --version | Out-String).Trim()
          $version = "${{ needs.prepare.outputs.version }}"
          $expected = "promptforge-workshop $version"
          if ($output -ne $expected) { throw "--version printed '$output', expected '$expected'" }
          $output
          $configDir = Join-Path $env:USERPROFILE ".promptforge"
          New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          # A default install lays the gateway beside the shell, so boot
          # launches it instead of using an explicit endpoint. A minimal
          # gateway.toml keeps that first boot free of STT model downloads;
          # the dummy workshop.toml endpoint remains the fallback when no
          # sibling gateway exists.
          Copy-Item ".github/fixtures/workshop-package-smoke/gateway.toml" $configDir
          Copy-Item ".github/fixtures/workshop-package-smoke/gateway.state.toml" $configDir
          @'
          [gateway]
          base_url = "http://127.0.0.1:1"
          api_key = "release-smoke"
          '@ | Set-Content (Join-Path $configDir "workshop.toml")
          $stdout = Join-Path $env:RUNNER_TEMP "workshop.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "workshop.stderr.log"
          $proc = Start-Process $exe.FullName -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $page = $null
          $port = $null
          foreach ($i in 1..60) {
            $proc.Refresh()
            if ($proc.HasExited) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "promptforge-workshop exited before serving the page with code $($proc.ExitCode)"
            }
            $ports = Get-NetTCPConnection -State Listen -OwningProcess $proc.Id -ErrorAction SilentlyContinue |
              Where-Object { $_.LocalAddress -eq "127.0.0.1" } |
              Select-Object -ExpandProperty LocalPort -Unique
            foreach ($candidate in $ports) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$candidate/" -UseBasicParsing -TimeoutSec 2
                if ($response.Content -match "<title>PromptForge</title>") {
                  $page = $response
                  $port = $candidate
                  break
                }
              } catch {
              }
            }
            if ($page) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $page) { throw "the workshop page never answered" }
          $js = Invoke-WebRequest -Uri "http://127.0.0.1:$port/app.js" -UseBasicParsing
          # The current minified workbench is about 2.5 MB.
          if ($js.RawContentLength -gt 3000000) { throw "app.js is unexpectedly large ($($js.RawContentLength) bytes)" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Install and check (macOS)
        if: matrix.name == 'macos-arm' || matrix.name == 'macos-intel'
        run: |
          set -e
          dmg=$(find dist -name "*.dmg" | head -1)
          [ -n "$dmg" ] || { echo "no DMG in the artifact"; exit 1; }
          hdiutil attach "$dmg" -nobrowse -quiet
          cp -R "/Volumes/PromptForge/PromptForge.app" /tmp/PromptForge.app
          hdiutil detach "/Volumes/PromptForge" -quiet
          # The bundle holds two executables (the gateway ships via
          # externalBin beside the main binary); pick the shell by name.
          bin="/tmp/PromptForge.app/Contents/MacOS/promptforge-workshop"
          [ -x "$bin" ] || { echo "promptforge-workshop not in the bundle"; exit 1; }
          version="${{ needs.prepare.outputs.version }}"
          output=$("$bin" --version)
          expected="promptforge-workshop $version"
          [ "$output" = "$expected" ] || { echo "--version printed '$output', expected '$expected'"; exit 1; }
          mkdir -p "$HOME/.promptforge"
          # A default install lays the gateway beside the shell, so boot
          # launches it instead of using an explicit endpoint. A minimal
          # gateway.toml keeps that first boot free of STT model downloads;
          # the dummy workshop.toml endpoint remains the fallback when no
          # sibling gateway exists.
          cp .github/fixtures/workshop-package-smoke/gateway.toml "$HOME/.promptforge/"
          cp .github/fixtures/workshop-package-smoke/gateway.state.toml "$HOME/.promptforge/"
          cat > "$HOME/.promptforge/workshop.toml" <<'EOF'
          [gateway]
          base_url = "http://127.0.0.1:1"
          api_key = "release-smoke"
          EOF
          "$bin" &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT
          port=""
          for i in $(seq 1 60); do
            port=$(lsof -nP -iTCP -sTCP:LISTEN -a -p "$app_pid" 2>/dev/null | grep -oE '127\.0\.0\.1:[0-9]+' | head -1 | cut -d: -f2)
            if [ -n "$port" ] && curl -sf "http://127.0.0.1:$port/" -o /tmp/workshop.html; then break; fi
            sleep 1
          done
          [ -n "$port" ] || { echo "the workshop server never listened"; exit 1; }
          grep -F "<title>PromptForge</title>" /tmp/workshop.html
          size=$(curl -sf "http://127.0.0.1:$port/app.js" | wc -c)
          # The current minified workbench is about 2.5 MB.
          [ "$size" -lt 3000000 ] || { echo "app.js is unexpectedly large ($size bytes)"; exit 1; }

      - name: Install and check (Linux)
        if: startsWith(matrix.name, 'linux')
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y xvfb
          deb=$(find dist -name "*.deb" | head -1)
          [ -n "$deb" ] || { echo "no deb in the artifact"; exit 1; }
          sudo dpkg -i "$deb" || sudo apt-get install -f -y
          package=$(dpkg-deb -f "$deb" Package)
          # The deb holds two executables (the gateway ships via
          # externalBin into /usr/bin beside the main binary); pick the
          # shell by name.
          bin=$(dpkg -L "$package" | grep -E '/usr/bin/promptforge-workshop$' | head -1)
          [ -n "$bin" ] || { echo "no promptforge-workshop in the deb"; exit 1; }
          version="${{ needs.prepare.outputs.version }}"
          output=$("$bin" --version)
          expected="promptforge-workshop $version"
          [ "$output" = "$expected" ] || { echo "--version printed '$output', expected '$expected'"; exit 1; }
          # The AppImage is not installed; check it exists and runs --version.
          appimage=$(find dist -name "*.AppImage" | head -1)
          [ -n "$appimage" ] || { echo "no AppImage in the artifact"; exit 1; }
          chmod +x "$appimage"
          output=$("$appimage" --version)
          [ "$output" = "$expected" ] || { echo "AppImage --version printed '$output', expected '$expected'"; exit 1; }
          mkdir -p "$HOME/.promptforge"
          # A default install lays the gateway beside the shell, so boot
          # launches it instead of using an explicit endpoint. A minimal
          # gateway.toml keeps that first boot free of STT model downloads;
          # the dummy workshop.toml endpoint remains the fallback when no
          # sibling gateway exists.
          cp .github/fixtures/workshop-package-smoke/gateway.toml "$HOME/.promptforge/"
          cp .github/fixtures/workshop-package-smoke/gateway.state.toml "$HOME/.promptforge/"
          cat > "$HOME/.promptforge/workshop.toml" <<'EOF'
          [gateway]
          base_url = "http://127.0.0.1:1"
          api_key = "release-smoke"
          EOF
          pid_file=$(mktemp)
          stdout=/tmp/workshop.stdout.log
          stderr=/tmp/workshop.stderr.log
          xvfb-run -a sh -c 'echo $$ > "$1"; exec "$2"' sh "$pid_file" "$bin" >"$stdout" 2>"$stderr" &
          xvfb_pid=$!
          app_pid=""
          trap '[ -z "$app_pid" ] || kill "$app_pid" 2>/dev/null || true; kill "$xvfb_pid" 2>/dev/null || true' EXIT
          page_port=""
          for i in $(seq 1 60); do
            if [ -z "$app_pid" ] && [ -s "$pid_file" ]; then
              app_pid=$(cat "$pid_file")
            fi
            if ! kill -0 "$xvfb_pid" 2>/dev/null; then
              if wait "$xvfb_pid"; then status=0; else status=$?; fi
              cat "$stdout" "$stderr"
              echo "xvfb-run exited before Workshop served the page with code $status"
              exit 1
            fi
            if [ -n "$app_pid" ] && ! kill -0 "$app_pid" 2>/dev/null; then
              if wait "$xvfb_pid"; then status=0; else status=$?; fi
              cat "$stdout" "$stderr"
              echo "promptforge-workshop exited before serving the page with code $status"
              exit 1
            fi
            if [ -n "$app_pid" ]; then
              ports=$(lsof -nP -a -p "$app_pid" -iTCP -sTCP:LISTEN -Fn 2>/dev/null |
                sed -n 's/^n127\.0\.0\.1:\([0-9][0-9]*\)$/\1/p' | sort -u)
              for candidate in $ports; do
                if curl -sf "http://127.0.0.1:$candidate/" -o /tmp/workshop-candidate.html &&
                   grep -Fq "<title>PromptForge</title>" /tmp/workshop-candidate.html; then
                  page_port=$candidate
                  mv /tmp/workshop-candidate.html /tmp/workshop.html
                  break
                fi
              done
            fi
            [ -z "$page_port" ] || break
            sleep 1
          done
          [ -n "$page_port" ] || { echo "the workshop server never answered"; exit 1; }
          grep -F "<title>PromptForge</title>" /tmp/workshop.html
          size=$(curl -sf "http://127.0.0.1:$page_port/app.js" | wc -c)
          # The current minified workbench is about 2.5 MB.
          [ "$size" -lt 3000000 ] || { echo "app.js is unexpectedly large ($size bytes)"; exit 1; }
          kill "$app_pid" 2>/dev/null || true
          wait "$xvfb_pid" 2>/dev/null || true

  publish:
    needs: [prepare, test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/workshop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Download every installer's artifact
        uses: actions/download-artifact@v4
        with:
          pattern: workshop-*
          path: dist

      - name: SHA256SUMS
        working-directory: dist
        run: |
          shopt -s globstar nullglob
          files=(**/*.exe **/*.dmg **/*.deb **/*.AppImage **/*.app.tar.gz)
          for file in "${files[@]}"; do
            digest=$(sha256sum "$file" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$digest" "$(basename "$file")"
          done | sort -k 2 > SHA256SUMS
          cat SHA256SUMS

      - name: Assemble latest.json
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          root = Path("dist")
          tag = os.environ["TAG_NAME"]
          version = tag.removeprefix("workshop-v")
          repository = os.environ["GITHUB_REPOSITORY"]
          platforms = {}
          for platform, artifact, pattern in [
              ("windows-x86_64", "workshop-windows", "*-setup.exe.sig"),
              ("darwin-aarch64", "workshop-macos-arm", "*.app.tar.gz.sig"),
              ("darwin-x86_64", "workshop-macos-intel", "*.app.tar.gz.sig"),
              ("linux-x86_64", "workshop-linux", "*.AppImage.sig"),
              ("linux-aarch64", "workshop-linux-arm", "*.AppImage.sig"),
          ]:
              folder = root / artifact
              signed = [
                  (Path(str(signature)[:-4]), signature)
                  for signature in folder.rglob(pattern)
                  if Path(str(signature)[:-4]).is_file()
              ]
              if len(signed) != 1:
                  names = ", ".join(str(path) for path, _ in signed)
                  raise SystemExit(f"{artifact} has {len(signed)} signed updater bundles: {names}")
              bundle, signature = signed[0]
              asset = bundle.name
              platforms[platform] = {
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{quote(asset)}",
                  "signature": signature.read_text(encoding="utf-8").strip(),
              }

          manifest = {
              "version": version,
              "notes": f"PromptForge Workshop {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          (root / "latest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python3 -m json.tool dist/latest.json

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PromptForge Workshop ${{ github.ref_name }}
          make_latest: true
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.sig
            dist/**/*.app.tar.gz
            dist/SHA256SUMS
            dist/latest.json

      - name: Stage version-free installer names
        shell: bash
        run: |
          set -e
          # Copies, not moves, staged after "Publish the release": the
          # versioned release keeps its versioned asset names, and the
          # evergreen names live only on the rolling latest release.
          mkdir -p dist/evergreen
          copy_one() {
            local pattern="$1" target="$2"
            local source
            source=$(find dist -path "*/$pattern" | head -1)
            [ -n "$source" ] || { echo "no installer matches $pattern"; exit 1; }
            cp "$source" "dist/evergreen/$target"
          }
          copy_one "workshop-windows/*-setup.exe" PromptForge-setup.exe
          copy_one "workshop-macos-arm/*.dmg" PromptForge-arm64.dmg
          copy_one "workshop-macos-intel/*.dmg" PromptForge-x64.dmg
          copy_one "workshop-linux/*.deb" PromptForge.deb
          copy_one "workshop-linux/*.AppImage" PromptForge.AppImage
          copy_one "workshop-linux-arm/*.deb" PromptForge-arm64.deb
          copy_one "workshop-linux-arm/*.AppImage" PromptForge-arm64.AppImage
          ls -l dist/evergreen

      - name: Publish the stable updater pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view workshop-latest >/dev/null 2>&1; then
            gh release upload workshop-latest \
              dist/latest.json dist/evergreen/* --clobber
          else
            gh release create workshop-latest \
              --target "$GITHUB_SHA" \
              --title "PromptForge Workshop updater" \
              --notes "Stable updater manifest for the latest tested Workshop release." \
              --latest=false \
              dist/latest.json dist/evergreen/*
          fi
