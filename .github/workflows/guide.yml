name: Deploy guide to Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Forks have no Pages site for this guide; skip the whole deployment
  # there. The deploy job follows through its `needs: build`.
  build:
    if: github.repository == 'cppalliance/promptforge'
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.44
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          wget -q "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf "mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build
        run: ./mdbook build guide
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: guide/book
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
