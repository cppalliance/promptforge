name: STT Miri

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-stt-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly-2026-09-05
          components: miri

      - name: Cache Cargo and Miri
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Prepare Miri
        run: cargo +nightly-2026-09-05 miri setup

      # Miri runs only backend-neutral ownership and bounded queue tests.
      # Socket I/O, dynamic FFI, native callbacks, and model loading stay in
      # their native CI targets because the interpreter cannot execute them.
      - name: Check pure STT worker ownership and queues
        run: cargo +nightly-2026-09-05 miri test -p gateway-stt-engine --features test-fixtures miri_

      # Filters cover generation admission, explicit request and job counts,
      # rollback epochs, registry and committed-item ownership, bounded
      # results, final segments, and audio state. Spawned tasks stay native.
      - name: Check pure STT generation and session ownership
        run: cargo +nightly-2026-09-05 miri test -p gateway-stt --features test-fixtures miri_

  native-whisper:
    # A self-hosted runner must never execute untrusted code: run this job
    # on pushes, dispatches, and same-repository PRs only. Fork PRs still
    # get the Miri jobs, which run on GitHub-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, cuda]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Provision pinned native fixtures
        shell: powershell
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'stt-native'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          $archive = Join-Path $fixture 'whisper.zip'
          Invoke-WebRequest `
            -Uri 'https://github.com/cppalliance/promptforge/releases/download/whisper-lib-b4938/whisper-b4938-windows-x86_64-cuda.zip' `
            -OutFile $archive
          $runtimeHash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($runtimeHash -ne 'F1BC54D7288E21EE826CCB5767249836B780FC316BEC4A0374873E73163DAE12') {
            throw "unexpected Whisper runtime hash: $runtimeHash"
          }
          Expand-Archive -Path $archive -DestinationPath $fixture -Force
          $model = Join-Path $fixture 'ggml-tiny.en.bin'
          Invoke-WebRequest `
            -Uri 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin' `
            -OutFile $model
          $modelHash = (Get-FileHash $model -Algorithm SHA256).Hash
          if ($modelHash -ne '921E4CF8686FDD993DCD081A5DA5B6C365BFDE1162E72B08D75AC75289920B1F') {
            throw "unexpected Whisper model hash: $modelHash"
          }
          $audio = Join-Path $fixture 'jfk.wav'
          Invoke-WebRequest `
            -Uri 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/b4938/samples/jfk.wav' `
            -OutFile $audio
          $audioHash = (Get-FileHash $audio -Algorithm SHA256).Hash
          if ($audioHash -ne '59DFB9A4ACB36FE2A2AFFC14BACBEE2920FF435CB13CC314A08C13F66BA7860E') {
            throw "unexpected Whisper audio hash: $audioHash"
          }
          # Speech spans of jfk.wav that the Silero tests score against.
          @'
          [
            { "text": "And so my fellow Americans,", "start_ms": 330, "end_ms": 2130 },
            { "text": "ask not", "start_ms": 3270, "end_ms": 4290 },
            { "text": "what your country can do for you,", "start_ms": 5400, "end_ms": 7530 },
            { "text": "ask what you can do for your country.", "start_ms": 8190, "end_ms": 10200 }
          ]
          '@ | Set-Content -Path (Join-Path $fixture 'jfk-lines.json') -Encoding ascii
          $silero = Join-Path $fixture 'ggml-silero-v6.2.0.bin'
          Invoke-WebRequest `
            -Uri 'https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin' `
            -OutFile $silero
          $sileroHash = (Get-FileHash $silero -Algorithm SHA256).Hash
          if ($sileroHash -ne '2AA269B785EEB53A82983A20501DDF7C1D9C48E33AB63A41391AC6C9F7FB6987') {
            throw "unexpected Silero model hash: $sileroHash"
          }
          # The long-speech test runs base.en for captions and small.en for finals.
          $baseModel = Join-Path $fixture 'ggml-base.en.bin'
          Invoke-WebRequest `
            -Uri 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin' `
            -OutFile $baseModel
          $baseHash = (Get-FileHash $baseModel -Algorithm SHA256).Hash
          if ($baseHash -ne 'A03779C86DF3323075F5E796CB2CE5029F00EC8869EEE3FDFB897AFE36C6D002') {
            throw "unexpected Whisper base model hash: $baseHash"
          }
          $smallModel = Join-Path $fixture 'ggml-small.en.bin'
          Invoke-WebRequest `
            -Uri 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en.bin' `
            -OutFile $smallModel
          $smallHash = (Get-FileHash $smallModel -Algorithm SHA256).Hash
          if ($smallHash -ne 'C6138D6D58ECC8322097E0F987C32F1BE8BB0A18532A3F88F734D1BBF9C41E5D') {
            throw "unexpected Whisper small model hash: $smallHash"
          }
          # Six LibriSpeech test-clean clips (CC BY 4.0) with a clips.json of their reference text.
          $speechArchive = Join-Path $fixture 'long-speech.zip'
          Invoke-WebRequest `
            -Uri 'https://github.com/cppalliance/promptforge/releases/download/stt-long-speech-1/stt-long-speech-1.zip' `
            -OutFile $speechArchive
          $speechHash = (Get-FileHash $speechArchive -Algorithm SHA256).Hash
          if ($speechHash -ne 'C8BB0618630D5FA76026F2B6CEC5EC3A0227DC12F710FB0BF01D12FDF1ED3FC7') {
            throw "unexpected long-speech clips hash: $speechHash"
          }
          $speechDir = Join-Path $fixture 'long-speech'
          Expand-Archive -Path $speechArchive -DestinationPath $speechDir -Force
          $fixture | Add-Content $env:GITHUB_PATH
          "PROMPTFORGE_WHISPER_LIBRARY=$(Join-Path $fixture 'whisper.dll')" | Add-Content $env:GITHUB_ENV
          "PROMPTFORGE_WHISPER_MODEL=$model" | Add-Content $env:GITHUB_ENV
          "PROMPTFORGE_WHISPER_AUDIO=$audio" | Add-Content $env:GITHUB_ENV
          "PROMPTFORGE_SILERO_MODEL=$silero" | Add-Content $env:GITHUB_ENV
          # PROMPTFORGE_WHISPER_MODEL stays at tiny.en for the steps below. Only the
          # long-speech step points the test at these paths, and it exports
          # PROMPTFORGE_LONG_SPEECH_CLIPS itself so no other ignored test sees it.
          "PROMPTFORGE_WHISPER_BASE_MODEL=$baseModel" | Add-Content $env:GITHUB_ENV
          "PROMPTFORGE_WHISPER_SMALL_MODEL=$smallModel" | Add-Content $env:GITHUB_ENV
          "PROMPTFORGE_LONG_SPEECH_DIR=$speechDir" | Add-Content $env:GITHUB_ENV
          # Native speech fixture configs default to the CPU build; this runner tests CUDA.
          "PROMPTFORGE_WHISPER_BACKEND=cuda" | Add-Content $env:GITHUB_ENV

      - name: Test safe Whisper backend integration
        run: cargo test --locked -p gateway-stt-backend-whisper --test native_whisper -- --ignored --test-threads=1

      # The noise test reads PROMPTFORGE_NOISE_CLIPS, which this runner does not provision.
      - name: Test native Silero speech detection
        run: cargo test --locked -p gateway-stt-backend-whisper --test native_silero -- --ignored --test-threads=1 --skip noise_clips_hold_no_speech_decision

      - name: Test native interim decode timing
        run: cargo test --locked -p gateway-stt-backend-whisper --test native_interim_timing -- --ignored --test-threads=1

      - name: Test native decoder warm-up
        run: cargo test --locked -p gateway-stt-backend-whisper --features test-fixtures --test native_warm_up -- --ignored --test-threads=1

      - name: Test native prompt budgets
        run: 'cargo test --locked -p gateway-stt-backend-whisper --lib prompt::tests:: -- --ignored --test-threads=1'

      - name: Test native Whisper FFI
        run: cargo test --locked -p gateway-whisper-ffi --lib -- --ignored --test-threads=1

      - name: Test native Gateway STT units
        run: cargo test --locked -p gateway-stt --lib -- --ignored --test-threads=1

      - name: Test native Gateway STT integration
        run: cargo test --locked -p gateway-stt --test it -- --ignored --test-threads=1

      # The long-speech test needs base.en for captions and small.en for finals, so
      # it sets its own environment here instead of using the job-wide tiny.en model.
      - name: Test native long-speech transcription
        shell: powershell
        run: |
          $env:PROMPTFORGE_LONG_SPEECH_CLIPS = $env:PROMPTFORGE_LONG_SPEECH_DIR
          $env:PROMPTFORGE_WHISPER_MODEL = $env:PROMPTFORGE_WHISPER_BASE_MODEL
          $env:PROMPTFORGE_WHISPER_FINAL_MODEL = $env:PROMPTFORGE_WHISPER_SMALL_MODEL
          cargo test --locked -p gateway-stt --test it realtime_long_speech -- --ignored --test-threads=1
