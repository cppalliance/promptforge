name: STT Miri

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-stt-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-05
          components: miri

      - name: Cache Cargo and Miri
        uses: Swatinem/rust-cache@v2

      - name: Prepare Miri
        run: cargo +nightly-2026-09-05 miri setup

      # Miri runs only backend-neutral ownership and bounded queue tests.
      # Socket I/O, dynamic FFI, native callbacks, and model loading stay in
      # their native CI targets because the interpreter cannot execute them.
      - name: Check pure STT worker ownership and queues
        run: cargo +nightly-2026-09-05 miri test -p gateway-stt-engine --features test-fixtures miri_

      # Filters cover generation admission, explicit request and job counts,
      # rollback epochs, registry and committed-item ownership, bounded
      # results, final segments, and audio state. Spawned tasks stay native.
      - name: Check pure STT generation and session ownership
        run: cargo +nightly-2026-09-05 miri test -p gateway-stt --features test-fixtures miri_

  native-whisper:
    runs-on: [self-hosted, windows, cuda]
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.89
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Verify preinstalled MSRV Rust
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredVersion = '1.89.0'
          $contractName = 'PROMPTFORGE_RUST_1_89_0_BIN'
          $contractBin = [Environment]::GetEnvironmentVariable($contractName)
          $rustBin = $null
          $rustBinSource = $null

          if (-not [string]::IsNullOrWhiteSpace($contractBin)) {
            $contractBin = $contractBin.Trim()
            if (-not [IO.Path]::IsPathRooted($contractBin)) {
              throw "self-hosted runner Rust $requiredVersion contract $contractName must be an absolute directory: '$contractBin'"
            }
            if (-not (Test-Path $contractBin -PathType Container)) {
              throw "self-hosted runner Rust $requiredVersion contract $contractName directory does not exist: '$contractBin'"
            }
            $rustBin = (Resolve-Path $contractBin).Path
            $rustBinSource = "contract $contractName"
          } else {
            $candidateBins = [Collections.Generic.List[object]]::new()
            $seenBins = [Collections.Generic.HashSet[string]]::new(
              [StringComparer]::OrdinalIgnoreCase
            )

            function Add-RustBinCandidate {
              param(
                [string] $Bin,
                [Parameter(Mandatory = $true)][string] $Source
              )

              if ([string]::IsNullOrWhiteSpace($Bin)) {
                return
              }
              try {
                $absoluteBin = [IO.Path]::GetFullPath(
                  [Environment]::ExpandEnvironmentVariables($Bin.Trim())
                )
              } catch {
                Write-Host "Ignoring invalid Rust bin candidate from ${Source}: '$Bin'"
                return
              }
              if ($seenBins.Add($absoluteBin)) {
                $candidateBins.Add([PSCustomObject]@{
                  Bin = $absoluteBin
                  Source = $Source
                })
              }
            }

            $toolchainNames = @(
              "$requiredVersion-x86_64-pc-windows-msvc",
              "$env:RUSTUP_TOOLCHAIN-x86_64-pc-windows-msvc",
              'stable-x86_64-pc-windows-msvc'
            ) | Select-Object -Unique

            function Add-RustupToolchainCandidates {
              param(
                [string] $RustupHome,
                [Parameter(Mandatory = $true)][string] $Source
              )

              if ([string]::IsNullOrWhiteSpace($RustupHome)) {
                return
              }
              foreach ($toolchainName in $toolchainNames) {
                Add-RustBinCandidate `
                  -Bin (Join-Path $RustupHome "toolchains\$toolchainName\bin") `
                  -Source "$Source rustup toolchain $toolchainName"
              }
            }

            $pathCargo = Get-Command 'cargo.exe' -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($pathCargo) {
              Add-RustBinCandidate -Bin (Split-Path -Parent $pathCargo.Source) -Source 'PATH cargo.exe'
            }
            $pathRustc = Get-Command 'rustc.exe' -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($pathRustc) {
              Add-RustBinCandidate -Bin (Split-Path -Parent $pathRustc.Source) -Source 'PATH rustc.exe'
            }

            $rustupHome = [Environment]::GetEnvironmentVariable('RUSTUP_HOME')
            Add-RustupToolchainCandidates -RustupHome $rustupHome -Source 'RUSTUP_HOME'

            $userProfile = [Environment]::GetEnvironmentVariable('USERPROFILE')
            if (-not [string]::IsNullOrWhiteSpace($userProfile)) {
              Add-RustupToolchainCandidates `
                -RustupHome (Join-Path $userProfile '.rustup') `
                -Source 'USERPROFILE'
            }

            # The persistent CUDA runner executes as NetworkService. Rustup's
            # prior installer output identified this existing service profile.
            $windowsDirectory = [Environment]::GetEnvironmentVariable('WINDIR')
            $networkServiceProfile = $null
            if (-not [string]::IsNullOrWhiteSpace($windowsDirectory)) {
              $networkServiceProfile = Join-Path $windowsDirectory 'ServiceProfiles\NetworkService'
              Add-RustupToolchainCandidates `
                -RustupHome (Join-Path $networkServiceProfile '.rustup') `
                -Source 'NetworkService'
            }

            $cargoHome = [Environment]::GetEnvironmentVariable('CARGO_HOME')
            if (-not [string]::IsNullOrWhiteSpace($cargoHome)) {
              Add-RustBinCandidate -Bin (Join-Path $cargoHome 'bin') -Source 'CARGO_HOME'
            }
            if (-not [string]::IsNullOrWhiteSpace($userProfile)) {
              Add-RustBinCandidate -Bin (Join-Path $userProfile '.cargo\bin') -Source 'USERPROFILE'
            }
            if (-not [string]::IsNullOrWhiteSpace($networkServiceProfile)) {
              Add-RustBinCandidate `
                -Bin (Join-Path $networkServiceProfile '.cargo\bin') `
                -Source 'NetworkService service profile'
            }

            $candidateReports = [Collections.Generic.List[string]]::new()
            foreach ($candidate in $candidateBins) {
              $missingTools = @(
                'cargo.exe',
                'rustc.exe'
              ) | Where-Object {
                -not (Test-Path (Join-Path $candidate.Bin $_) -PathType Leaf)
              }
              if ($missingTools.Count -eq 0) {
                $rustBin = (Resolve-Path $candidate.Bin).Path
                $rustBinSource = $candidate.Source
                Write-Host "Discovered preprovisioned Rust bin from ${rustBinSource}: '$rustBin'"
                break
              }
              $candidateReports.Add(
                "$($candidate.Source) '$($candidate.Bin)' missing $($missingTools -join ', ')"
              )
            }

            if ([string]::IsNullOrWhiteSpace($rustBin)) {
              $identity = "$([Environment]::UserDomainName)\$([Environment]::UserName)"
              $checked = if ($candidateReports.Count -eq 0) {
                '(no candidate directories were available)'
              } else {
                $candidateReports -join '; '
              }
              throw "self-hosted runner Rust $requiredVersion is not provisioned for '$identity': no bounded candidate directory contained cargo.exe and rustc.exe. Checked: $checked. Provision both tools together outside CI or set $contractName to their absolute versioned bin directory"
            }
          }

          function Resolve-RustTool {
            param(
              [Parameter(Mandatory = $true)][string] $Name,
              [Parameter(Mandatory = $true)][string] $Bin
            )

            $candidate = Join-Path $Bin "$Name.exe"
            if (-not (Test-Path $candidate -PathType Leaf)) {
              throw "self-hosted runner Rust $requiredVersion selected bin from $rustBinSource is missing $Name.exe at '$candidate'; provision cargo.exe and rustc.exe together outside CI or set $contractName"
            }
            return (Resolve-Path $candidate).Path
          }

          function Assert-RustToolVersion {
            param(
              [Parameter(Mandatory = $true)][string] $Name,
              [Parameter(Mandatory = $true)][string] $ToolPath
            )

            $versionLines = @(& $ToolPath '--version' 2>&1)
            $exitCode = $LASTEXITCODE
            $versionText = ($versionLines | Out-String).Trim()
            if ($exitCode -ne 0) {
              throw "self-hosted runner $Name.exe failed at '$ToolPath' with exit code ${exitCode}; provision Rust $requiredVersion outside CI and expose it through PATH or $contractName. Output: $versionText"
            }

            $versionMatch = [regex]::Match(
              $versionText,
              "^$([regex]::Escape($Name))\s+(\d+\.\d+\.\d+)(?:\s|$)"
            )
            if (-not $versionMatch.Success) {
              throw "self-hosted runner $Name.exe returned an unrecognized version at '$ToolPath'; required repository MSRV is exactly $requiredVersion. Output: $versionText"
            }
            $actualVersion = $versionMatch.Groups[1].Value
            if ($actualVersion -ne $requiredVersion) {
              throw "self-hosted runner $Name.exe has Rust toolchain version $actualVersion at '$ToolPath'; required repository MSRV is exactly $requiredVersion. Reprovision it outside CI or point $contractName at the correct versioned bin directory"
            }

            Write-Host "Using $Name $actualVersion from $ToolPath"
          }

          function Test-RustupProxy {
            param(
              [Parameter(Mandatory = $true)][string] $ToolPath
            )

            $proxyVersionLines = @(& $ToolPath "+$env:RUSTUP_TOOLCHAIN" '--version' 2>&1)
            $proxyExitCode = $LASTEXITCODE
            if ($proxyExitCode -ne 0) {
              return $false
            }
            $proxyVersionText = ($proxyVersionLines | Out-String).Trim()
            return [regex]::IsMatch(
              $proxyVersionText,
              "^cargo\s+$([regex]::Escape($requiredVersion))(?:\s|$)"
            )
          }

          $cargo = Resolve-RustTool -Name 'cargo' -Bin $rustBin
          $rustc = Resolve-RustTool -Name 'rustc' -Bin $rustBin
          Assert-RustToolVersion -Name 'cargo' -ToolPath $cargo
          Assert-RustToolVersion -Name 'rustc' -ToolPath $rustc

          $cargoIsRustupProxy = Test-RustupProxy -ToolPath $cargo
          if ($cargoIsRustupProxy) {
            $cargoHash = (Get-FileHash $cargo -Algorithm SHA256).Hash
            $rustcHash = (Get-FileHash $rustc -Algorithm SHA256).Hash
            if ($cargoHash -ne $rustcHash) {
              throw "self-hosted runner Rust $requiredVersion mixes a rustup cargo proxy with a direct rustc.exe; provision both tools from one direct or rustup-managed toolchain"
            }
            $rustup = Resolve-RustTool -Name 'rustup' -Bin $rustBin
            $rustupHash = (Get-FileHash $rustup -Algorithm SHA256).Hash
            if ($cargoHash -ne $rustupHash) {
              throw "self-hosted runner Rust $requiredVersion rustup.exe does not match the selected cargo.exe and rustc.exe proxies"
            }
            Write-Host "Using rustup proxies from $rustup"
          } else {
            Write-Host 'Using direct Rust tools'
          }

          $rustBin | Add-Content -Path $env:GITHUB_PATH

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Provision pinned native fixtures
        shell: powershell
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'stt-native'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          $archive = Join-Path $fixture 'whisper.zip'
          Invoke-WebRequest `
            -Uri 'https://github.com/cppalliance/promptforge/releases/download/whisper-lib-b4938/whisper-b4938-windows-x86_64-cuda.zip' `
            -OutFile $archive
          $runtimeHash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($runtimeHash -ne 'F1BC54D7288E21EE826CCB5767249836B780FC316BEC4A0374873E73163DAE12') {
            throw "unexpected Whisper runtime hash: $runtimeHash"
          }
          Expand-Archive -Path $archive -DestinationPath $fixture -Force
          $model = Join-Path $fixture 'ggml-tiny.en.bin'
          Invoke-WebRequest `
            -Uri 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin' `
            -OutFile $model
          $modelHash = (Get-FileHash $model -Algorithm SHA256).Hash
          if ($modelHash -ne '921E4CF8686FDD993DCD081A5DA5B6C365BFDE1162E72B08D75AC75289920B1F') {
            throw "unexpected Whisper model hash: $modelHash"
          }
          $audio = Join-Path $fixture 'jfk.wav'
          Invoke-WebRequest `
            -Uri 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/b4938/samples/jfk.wav' `
            -OutFile $audio
          $audioHash = (Get-FileHash $audio -Algorithm SHA256).Hash
          if ($audioHash -ne '59DFB9A4ACB36FE2A2AFFC14BACBEE2920FF435CB13CC314A08C13F66BA7860E') {
            throw "unexpected Whisper audio hash: $audioHash"
          }
          $fixture | Add-Content $env:GITHUB_PATH
          "PROMPTFORGE_WHISPER_LIBRARY=$(Join-Path $fixture 'whisper.dll')" | Add-Content $env:GITHUB_ENV
          "PROMPTFORGE_WHISPER_MODEL=$model" | Add-Content $env:GITHUB_ENV
          "PROMPTFORGE_WHISPER_AUDIO=$audio" | Add-Content $env:GITHUB_ENV

      - name: Test safe Whisper backend integration
        run: cargo test --locked -p gateway-stt-backend-whisper --test native_whisper -- --ignored --test-threads=1

      - name: Test native prompt budgets
        run: 'cargo test --locked -p gateway-stt-backend-whisper --lib prompt::tests:: -- --ignored --test-threads=1'

      - name: Test native Whisper FFI
        run: cargo test --locked -p gateway-whisper-ffi --lib -- --ignored --test-threads=1

      - name: Test native Gateway STT units
        run: cargo test --locked -p gateway-stt --lib -- --ignored --test-threads=1

      - name: Test native Gateway STT integration
        run: cargo test --locked -p gateway-stt --test it -- --ignored --test-threads=1
