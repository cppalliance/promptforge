name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # RUSTUP_TOOLCHAIN outranks the repo's rust-toolchain.toml (pinned to the
    # MSRV for local builds); this job means to test stable.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: crates/promptforge-workshop-server/ui
        run: npm ci

      - name: Install config UI dependencies
        working-directory: crates/promptforge-gateway-config-ui/ui
        run: npm ci

      - name: Format
        run: cargo fmt --all --check

      # The desktop packages stay in their platform jobs because Linux needs
      # Tauri system libraries. All gateway and STT features are pure Rust
      # now that whisper.cpp is loaded from a managed runtime artifact.
      - name: Clippy
        run: cargo clippy --workspace --exclude promptforge-workshop --exclude promptforge-workshop-server --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --exclude promptforge-workshop --exclude promptforge-workshop-server --all-features

      - name: Doctests
        run: cargo test --workspace --exclude promptforge-workshop --exclude promptforge-workshop-server --all-features --doc

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --exclude promptforge-workshop --exclude promptforge-workshop-server

      # No build step may write into the repository (the UI bundles build
      # into OUT_DIR now); catch a regression here rather than in a diff.
      - name: Clean tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the build dirtied the repository:"
            git status --porcelain
            exit 1
          fi

  check-workshop:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: crates/promptforge-workshop-server/ui
        run: npm ci

      # promptforge-workshop pins the gateway's config-ui feature, so its
      # build script needs the config UI's node_modules.
      - name: Install config UI dependencies
        working-directory: crates/promptforge-gateway-config-ui/ui
        run: npm ci

      - name: Clippy (workshop)
        run: cargo clippy -p promptforge-workshop -p promptforge-workshop-server --all-targets -- -D warnings

      - name: Test (workshop)
        run: cargo test --locked -p promptforge-workshop -p promptforge-workshop-server

      - name: Clean tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the build dirtied the repository:"
            git status --porcelain
            exit 1
          fi

  # First Linux build of the desktop app: compile-only, against the Tauri
  # system packages a Linux developer installs per the README. Catches the
  # missing-system-package class of failure the Windows-only job cannot see.
  check-workshop-linux:
    runs-on: ubuntu-22.04
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: crates/promptforge-workshop-server/ui
        run: npm ci

      - name: Install config UI dependencies
        working-directory: crates/promptforge-gateway-config-ui/ui
        run: npm ci

      - name: Build (workshop, Linux)
        run: cargo build --locked -p promptforge-workshop

      - name: Clean tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the build dirtied the repository:"
            git status --porcelain
            exit 1
          fi

  # The UI build is its own job: typecheck, bundle, and test. The cargo
  # jobs drive the same bundle through the crates' build scripts, hence
  # their npm ci.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: crates/promptforge-workshop-server/ui
        run: npm ci

      - name: Typecheck
        working-directory: crates/promptforge-workshop-server/ui
        run: npm run typecheck

      - name: Build
        working-directory: crates/promptforge-workshop-server/ui
        run: npm run build

      - name: Test
        working-directory: crates/promptforge-workshop-server/ui
        run: npm test

      - name: Install config UI dependencies
        working-directory: crates/promptforge-gateway-config-ui/ui
        run: npm ci

      - name: Typecheck config UI
        working-directory: crates/promptforge-gateway-config-ui/ui
        run: npm run typecheck

      - name: Build config UI
        working-directory: crates/promptforge-gateway-config-ui/ui
        run: npm run build

      - name: Test config UI
        working-directory: crates/promptforge-gateway-config-ui/ui
        run: npm test

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: crates/promptforge-workshop-server/ui
        run: npm ci

      - name: Install config UI dependencies
        working-directory: crates/promptforge-gateway-config-ui/ui
        run: npm ci

      - name: Build and test on MSRV
        run: |
          cargo build --locked --workspace --exclude promptforge-workshop --exclude promptforge-workshop-server --all-features
          cargo test --locked --workspace --exclude promptforge-workshop --exclude promptforge-workshop-server --all-features

  supply-chain:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny and cargo-audit
        run: cargo install cargo-deny cargo-audit --locked

      - name: cargo deny
        run: cargo deny check

      - name: cargo audit
        run: cargo audit
