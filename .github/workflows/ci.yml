name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# promptforge-tool-picker's build script downloads its embedding model from the
# Hugging Face Hub. Anonymous requests are rate limited per IP, and the Actions
# runner pool shares those IPs with every other project's CI, so authenticate
# when we can. Empty on fork PRs (secrets are withheld); hf-hub then falls back
# to anonymous, which is what the cache is there to make rare.
env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    # RUSTUP_TOOLCHAIN outranks the repo's rust-toolchain.toml (pinned to the
    # MSRV for local builds); this job means to test stable.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: dtolnay/rust-toolchain@1.89.0

      # cargo-public-api 0.52.0 requires nightly rustdoc JSON. Keep this exact
      # and in sync with the explicit +toolchain invocation in the driver.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-05

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache the embedding model
        uses: ./.github/actions/hf-model-cache

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test integration test ceiling driver
        run: node tools/check-integration-test-ceilings.test.mjs

      - name: Check integration test ceilings
        run: node tools/check-integration-test-ceilings.mjs

      - name: Install architecture tools
        run: |
          RUSTUP_TOOLCHAIN=1.89.0 cargo install cargo-modules --version 0.25.0 --locked
          RUSTUP_TOOLCHAIN=1.89.0 cargo install cargo-public-api --version 0.52.0 --locked

      - name: Install config UI dependencies
        working-directory: crates/gateway-config-ui/ui
        run: npm ci

      - name: Build Gateway without Workshop UI tooling
        run: cargo build --locked -p gateway

      - name: Test STT architecture driver
        run: node --test tools/check-stt-architecture.test.mjs

      - name: Check STT module and public API architecture
        run: node tools/check-stt-architecture.mjs

      - name: Check STT Cargo and ceiling architecture
        run: cargo test -p gateway-stt --test it architecture

      - name: Format
        run: cargo fmt --all --check

      # The desktop packages stay in their platform jobs because Linux needs
      # Tauri system libraries. All gateway and STT features are pure Rust
      # now that whisper.cpp is loaded from a managed runtime artifact.
      - name: Clippy
        run: cargo clippy --workspace --exclude workshop --exclude workshop-server --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --exclude workshop --exclude workshop-server --all-features

      - name: Doctests
        run: cargo test --workspace --exclude workshop --exclude workshop-server --all-features --doc

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --exclude workshop --exclude workshop-server

      - name: Check headless gateway
        run: cargo check -p gateway --no-default-features

      # No build step may write into the repository (the UI bundles build
      # into OUT_DIR now); catch a regression here rather than in a diff.
      - name: Clean tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the build dirtied the repository:"
            git status --porcelain
            exit 1
          fi

  check-workshop:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache the embedding model
        uses: ./.github/actions/hf-model-cache

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: crates/workshop-server/ui
        run: npm ci

      - name: Build featureless Gateway
        run: cargo build --locked -p gateway --no-default-features

      - name: Stage Gateway sidecar
        run: node tools/stage-gateway-sidecar.mjs stage --target x86_64-pc-windows-msvc --source target/debug/promptforge-gateway.exe

      - name: Clippy (workshop)
        run: cargo clippy -p workshop -p workshop-server --all-targets -- -D warnings

      - name: Test (workshop)
        run: cargo test --locked -p workshop -p workshop-server

      - name: Remove Gateway sidecar
        if: always()
        run: node tools/stage-gateway-sidecar.mjs remove --target x86_64-pc-windows-msvc

      - name: Clean tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the build dirtied the repository:"
            git status --porcelain
            exit 1
          fi

  # First Linux build of the desktop app: compile-only, against the Tauri
  # system packages a Linux developer installs per the README. Catches the
  # missing-system-package class of failure the Windows-only job cannot see.
  check-workshop-linux:
    runs-on: ubuntu-22.04
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache the embedding model
        uses: ./.github/actions/hf-model-cache

      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: crates/workshop-server/ui
        run: npm ci

      - name: Build featureless Gateway
        run: cargo build --locked -p gateway --no-default-features

      - name: Stage Gateway sidecar
        run: node tools/stage-gateway-sidecar.mjs stage --target x86_64-unknown-linux-gnu --source target/debug/promptforge-gateway

      - name: Build (workshop, Linux)
        run: cargo build --locked -p workshop

      - name: Remove Gateway sidecar
        if: always()
        run: node tools/stage-gateway-sidecar.mjs remove --target x86_64-unknown-linux-gnu

      - name: Clean tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the build dirtied the repository:"
            git status --porcelain
            exit 1
          fi

  # The UI build is its own job: typecheck, bundle, and test. The cargo
  # jobs drive the same bundle through the crates' build scripts, hence
  # their npm ci.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: crates/workshop-server/ui
        run: npm ci

      - name: Typecheck
        working-directory: crates/workshop-server/ui
        run: npm run typecheck

      - name: Build
        working-directory: crates/workshop-server/ui
        run: npm run build

      - name: Test
        working-directory: crates/workshop-server/ui
        run: npm test

      - name: Install config UI dependencies
        working-directory: crates/gateway-config-ui/ui
        run: npm ci

      - name: Typecheck config UI
        working-directory: crates/gateway-config-ui/ui
        run: npm run typecheck

      - name: Build config UI
        working-directory: crates/gateway-config-ui/ui
        run: npm run build

      - name: Test config UI
        working-directory: crates/gateway-config-ui/ui
        run: npm test

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache the embedding model
        uses: ./.github/actions/hf-model-cache

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: crates/workshop-server/ui
        run: npm ci

      - name: Install config UI dependencies
        working-directory: crates/gateway-config-ui/ui
        run: npm ci

      - name: Build and test on MSRV
        run: |
          cargo build --locked --workspace --exclude workshop --exclude workshop-server --all-features
          cargo test --locked --workspace --exclude workshop --exclude workshop-server --all-features

  supply-chain:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny and cargo-audit
        run: cargo install cargo-deny cargo-audit --locked

      - name: cargo deny
        run: cargo deny check

      - name: cargo audit
        run: cargo audit
