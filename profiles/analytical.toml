# Analytical profile: inherits remote Anthropic from base, plus an optional
# local generative model. Uncomment [[local_model]] when a GGUF URL/path is ready.
include = ["base.toml"]

[[device]]
id = "local-gpu"
type = "local"

[[device.lane]]
device = "local-gpu"
id = "generative"
concurrency = 1

[[device.lane]]
device = "local-gpu"
id = "utility"
concurrency = 8

