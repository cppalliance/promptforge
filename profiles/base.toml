# Shared remote Anthropic endpoint. Secrets expand from the environment.
# Install as the `profiles/` directory beside your boot gateway.toml.

[server]
bind = "127.0.0.1:8081"
api_key = "${PROMPTFORGE_GATEWAY_API_KEY}"

[queue]
max_depth = 100
fair_scheduling = true

[[device]]
id = "anthropic"
type = "remote"
concurrency = 10

[[endpoint]]
id = "anthropic"
protocol = "openai"
base_url = "https://api.anthropic.com/v1"
api_key = "${ANTHROPIC_API_KEY}"
device = "anthropic"

[[model]]
name = "claude-sonnet-4-6"
description = "Frontier model for complex analysis and coding"
context = 200000
thinking = "never"
upstream = "claude-sonnet-4-6"
endpoints = ["anthropic"]

[tools.web_search]
provider = "brave"
api_key = "${BRAVE_API_KEY}"
