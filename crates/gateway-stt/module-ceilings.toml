# Exact source and public-root ratchets for the gateway STT facade.
# Physical lines include comments and blanks. A source file may shrink but
# may not exceed its recorded ceiling.

public_root_budget = 9

[migration_targets."api.rs"]
target_step = "Step 17"
destination = "batch.rs"

[migration_targets."runtime.rs"]
target_step = "Step 17"
destination = "service.rs, artifacts.rs, generation.rs, status.rs, and model.rs"

[migration_targets."stt.rs"]
target_step = "Step 28"
destination = "removal after the Realtime route and Workshop relay replace the legacy socket"

[migration_targets."take.rs"]
target_step = "Step 16"
destination = "independent committed-item finalization"

