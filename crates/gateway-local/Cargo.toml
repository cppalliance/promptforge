[package]
name = "gateway-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge gateway local inference: GGUF provisioning, artifact store, and the llama-server child lifecycle"
readme = "README.md"
keywords = ["llm", "gateway", "openai", "gguf"]
categories = ["web-programming::http-server"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
async-trait.workspace = true
flate2.workspace = true
gateway-config.workspace = true
shared-protocol.workspace = true
gateway-routing.workspace = true
shared-progress.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
# CancellationToken for the cancellable provisioning path (the gateway's
# command queue); default-features off, the sync module is ungated.
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
zip.workspace = true

[dev-dependencies]
minijinja.workspace = true
minijinja-contrib.workspace = true
gateway-routing = { workspace = true, features = ["test-helpers"] }
tempfile.workspace = true

[lints]
workspace = true

