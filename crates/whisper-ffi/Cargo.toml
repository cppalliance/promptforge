[package]
name = "whisper-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "Runtime-loaded safe bindings for PromptForge's pinned whisper.cpp C API"

[dependencies]
libloading.workspace = true
thiserror.workspace = true

# Dynamic symbol calls are the purpose of this crate. Keep unsafe denied
# globally and opt into the smallest documented blocks at each FFI boundary.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
doc_markdown = "allow"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
