[package]
name = "promptforge-model-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "PromptForge gateway model client: OpenAI-shaped completions transport, wire types, and the model catalog/binding vocabulary"
readme = "README.md"
keywords = ["llm", "gateway", "openai", "http-client"]
categories = ["web-programming::http-client"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
futures-util.workspace = true
# The canonical metrics vocabulary (Usage, LlamaTimings, VllmMetrics,
# ClientTiming, CallMetrics) this crate parses response bodies into and
# re-exports.
promptforge-core-support.workspace = true
# The serde feature decodes the gateway's progress event stream.
shared-progress = { workspace = true, features = ["serde"] }
promptforge-tool-picker.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
tokio.workspace = true

[lints]
workspace = true
