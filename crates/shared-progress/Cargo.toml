[package]
name = "shared-progress"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge gateway live-activity hub: a busy flag and producer-owned text published over a watch channel"

[dependencies]
gateway-api-types.workspace = true
# `sync` carries the hub's watch channel; nothing else of tokio is used.
tokio = { workspace = true, features = ["sync"] }
workspace-hack.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
