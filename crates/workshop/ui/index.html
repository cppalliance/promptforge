<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptForge</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="ws-window-titlebar" hidden>
  <div class="ws-window-titlebar__left">
    <img class="ws-window-titlebar__icon" src="/icons/promptforge-icon.png" srcset="/icons/promptforge-icon.png 1x, /icons/promptforge-icon@2x.png 2x" alt="" width="20" height="20">
    <nav class="ws-window-titlebar__menus" aria-label="Application menus" role="menubar"></nav>
  </div>
  <div class="ws-window-titlebar__center ws-window-titlebar__drag"></div>
  <div class="ws-window-titlebar__right">
    <div class="ws-window-titlebar__controls">
    <button type="button" class="ws-window-titlebar__control ws-window-titlebar__control--minimize" data-command="minimize" aria-label="Minimize">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
        <path d="M2 6h8" />
      </svg>
    </button>
    <button type="button" class="ws-window-titlebar__control ws-window-titlebar__control--maximize" data-command="toggle-maximize" aria-label="Maximize">
      <svg class="ws-window-titlebar__glyph--maximize" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
        <rect x="2.5" y="2.5" width="7" height="7" />
      </svg>
      <svg class="ws-window-titlebar__glyph--restore" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true" hidden>
        <path d="M4.5 4.5v-2h6v6h-2" />
        <rect x="1.5" y="4.5" width="6" height="6" />
      </svg>
    </button>
    <button type="button" class="ws-window-titlebar__control ws-window-titlebar__control--close" data-command="close" aria-label="Close">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
        <path d="M2.5 2.5l7 7M9.5 2.5l-7 7" />
      </svg>
    </button>
    </div>
  </div>
</header>
<div class="ws-shell">
  <div class="ws-dock-column">
    <div id="dock" class="ws-dock"></div>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
