[package]
name = "workshop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge Workshop desktop app: hosts the workshop server in-process and opens the workshop window"

[[bin]]
name = "promptforge-workshop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# The in-process workshop server: the shell spawns it on an OS-assigned
# loopback port and points the window at it.
workshop-server.workspace = true
serde_json.workspace = true
# The health wait comes from the shared connection-file seam.
shared-sidecar.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-process.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-window-state.workspace = true
url.workspace = true

# Explorer path drops and the microphone permission grant (src/bridge.rs):
# raw WebView2 COM. The versions mirror tauri-runtime-wry's, keeping one
# build of each crate in the tree.
[target.'cfg(target_os = "windows")'.dependencies.webview2-com]
version = "0.38"

[target.'cfg(target_os = "windows")'.dependencies.windows-core]
version = "0.61"

# Linux microphone permission: WebKitGTK ships with enable-media-stream off
# and a deny-all permission handler; src/bridge.rs opts the session in.
[target.'cfg(target_os = "linux")'.dependencies.webkit2gtk]
version = "2.0.2"

[build-dependencies]
tauri-build.workspace = true

[features]
default = []

[dev-dependencies]
tempfile.workspace = true

# Not `workspace = true`: the WebView2 file-drop bridge (src/bridge.rs) is
# raw COM and cannot be written without unsafe, and a workspace `forbid`
# cannot be overridden by a module allow. The workspace lint set is
# mirrored with unsafe_code lowered to deny, which bridge.rs alone opts
# out of.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
doc_markdown = "allow"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
