[package]
name = "workshop-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# `SearchProvider`, which the agent sessions' Gateway search implements,
# is an `async_trait` trait.
async-trait.workspace = true
axum.workspace = true
futures-util.workspace = true
# The Harness public API: each conversation's launch builds the per-run
# Harness that runs it.
harness.workspace = true
# The Gateway web search client the agent sessions' search provider
# sends each search through.
harness-gateway-client.workspace = true
# The two Plugins every agent run's Host installs: `promptforge/web`, with
# the search-provider and runtime services it reads, and
# `promptforge/user-input`, whose ask tool id the agent socket frames by.
plugin-user-input.workspace = true
plugin-web.workspace = true
# The Engine's public API: the events the agent socket frames as
# transcript entries and the status reporter derives status from, and
# the prompt parser behind the `/prompts/contract` route.
promptforge.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
shared-loopback.workspace = true
gateway-api-discovery.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
# The conversation layer: the conversation table, transcripts, input
# waits, agent discovery, and the recorder tee each run writes through.
workshop-agents.workspace = true
workshop-gateway.workspace = true
workshop-menu.workspace = true
workshop-protocol.workspace = true
workshop-registry.workspace = true
workshop-run-log.workspace = true
workshop-status.workspace = true
workshop-support.workspace = true
workshop-user-state.workspace = true
workshop-workspace.workspace = true
tempfile = { workspace = true, optional = true }
workspace-hack.workspace = true

[features]
default = []
# Drops the webview asset layer: the build script skips the esbuild UI
# build, and the asset routes serve through a no-op implementation, so
# server-only integration tests run without Node.js or the UI bundle.
headless = []
test-fixtures = [
    "dep:tempfile",
    "workshop-gateway/test-fixtures",
    "workshop-support/test-fixtures",
    "workshop-workspace/test-fixtures",
]

[dev-dependencies]
workshop-server = { path = ".", features = ["test-fixtures"] }
# The test-fixtures feature exposes `resolve_for_test`, so the resolution
# tests can run the real liveness gauntlet against the test binary's own
# process image.
gateway-api-discovery = { workspace = true, features = ["test-fixtures"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

# The build script bundles the UI with esbuild into OUT_DIR through the
# shared helper; nothing UI-built lands in the repository.
[build-dependencies]
build-ceiling.workspace = true
build-ui = { path = "../../build-ui" }

[lints]
workspace = true

# Not released through cargo-dist; the gateway is the only disted package
# (see dist-workspace.toml).
[package.metadata.dist]
dist = false
