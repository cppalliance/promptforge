[package]
name = "workshop-support"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "Workshop support vocabulary: atomic writes, reconnect backoff, route deadlines, workshop.toml configuration, the retained broadcast bus, error-message rendering, and the JSON state-bucket validator"

[features]
default = []
# Exposes test seams (`ReconnectBackoff::is_escalated_for_test` and the
# `fixtures::serve` mock HTTP server) to the dependent crates' tests.
test-fixtures = []

[dependencies]
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

[lints]
workspace = true
