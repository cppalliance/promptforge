[package]
name = "workshop-server-api"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "The desktop app's view of the workshop server: re-exports only, so server internals never resolve in the desktop app"

[features]
default = []
# Forwards the server's integration-test seams (`fixtures`) to the desktop app's
# tests without the desktop app depending on `workshop-server` itself.
test-fixtures = ["workshop-server/test-fixtures"]

[dependencies]
workshop-server.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
workshop-server-api = { path = ".", features = ["test-fixtures"] }

[lints]
workspace = true
