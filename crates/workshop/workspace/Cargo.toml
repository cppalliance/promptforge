[package]
name = "workshop-workspace"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "Workshop workspace subsystem: the jailed filesystem behind /workspace/* - directory trees, file reads, and file writes confined to granted roots"

[features]
default = []
# Exposes test seams (`Workspace::close_backing_for_test`,
# `create_alien_database_for_test`) to the dependent crates' tests.
test-fixtures = []

[dependencies]
axum.workspace = true
dunce.workspace = true
humantime.workspace = true
percent-encoding.workspace = true
promptforge-api-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
shared-error-source = { workspace = true, features = ["database", "json"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
turso.workspace = true
workshop-protocol.workspace = true
workshop-registry.workspace = true
workshop-support.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true

[lints]
workspace = true
