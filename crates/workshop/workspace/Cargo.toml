[package]
name = "workshop-workspace"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "Workshop workspace subsystem: the jailed filesystem behind /workspace/* - directory trees, file reads, and file writes confined to granted roots - and the /workspace/file/* routes over the .pfwork workspace file"

[features]
default = []
# Exposes test seams (`Workspace::close_backing_for_test`,
# `Workspace::stall_next_write_for_test` and its `WriteStallHandle`,
# `routes_with_deadline`, and `create_alien_database_for_test`) to the
# dependent crates' tests.
test-fixtures = []

[dependencies]
axum.workspace = true
dunce.workspace = true
humantime.workspace = true
serde.workspace = true
serde_json.workspace = true
shared-error-source = { workspace = true, features = ["database", "json"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
turso.workspace = true
workshop-protocol.workspace = true
workshop-registry.workspace = true
workshop-support.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# The save-timeout integration test drives `routes_with_deadline` and the
# write stall, both behind `test-fixtures`.
workshop-workspace = { path = ".", features = ["test-fixtures"] }
percent-encoding.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true

[lints]
workspace = true
