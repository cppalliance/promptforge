[package]
name = "workshop-gateway"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "Workshop gateway subsystem: the bearer-authenticated gateway HTTP client, endpoint binding and discovery, heartbeat, and progress subscriber"

[features]
test-fixtures = ["dep:tempfile", "workshop-support/test-fixtures"]

[dependencies]
arc-swap.workspace = true
futures-util.workspace = true
# The gateway's public wire vocabulary: the progress snapshot the
# `GET /admin/progress` stream sends.
gateway-api-types.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
gateway-api-discovery.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
workshop-protocol.workspace = true
workshop-registry.workspace = true
workshop-support.workspace = true
tempfile = { workspace = true, optional = true }
workspace-hack.workspace = true

[dev-dependencies]
axum.workspace = true
# The test-fixtures feature exposes `resolve_for_test`, so the resolution
# tests can run the real liveness gauntlet against the test binary's own
# process image.
gateway-api-discovery = { workspace = true, features = ["test-fixtures"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The gateway's tests call `workshop_support::fixtures::serve`; enabling the
# feature here (not only through the crate's own `test-fixtures` feature)
# keeps `cargo test -p workshop-gateway` compiling without `--all-features`.
workshop-support = { workspace = true, features = ["test-fixtures"] }

[lints]
workspace = true
