[package]
name = "workshop-gateway"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "Workshop gateway subsystem: the bearer-authenticated gateway HTTP client, endpoint binding and discovery, heartbeat, progress subscriber, and the run event log"

[features]
test-fixtures = ["dep:tempfile"]

[dependencies]
arc-swap.workspace = true
futures-util.workspace = true
# The gateway's public wire vocabulary: the progress snapshot the
# `GET /admin/progress` stream carries.
gateway-api-types.workspace = true
promptforge-api-types.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
gateway-api-discovery.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
workshop-protocol.workspace = true
workshop-registry.workspace = true
workshop-support.workspace = true
tempfile = { workspace = true, optional = true }
workspace-hack.workspace = true

[dev-dependencies]
axum.workspace = true
# The test-fixtures feature exposes `resolve_for_test`, so the resolution
# tests can run the real liveness gauntlet against the test binary's own
# process image.
gateway-api-discovery = { workspace = true, features = ["test-fixtures"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
