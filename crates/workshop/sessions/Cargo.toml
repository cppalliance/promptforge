[package]
name = "workshop-sessions"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "Workshop sessions subsystem: the /ws workbench socket, the /agents/ws agent-session socket with supervision and input waits, and the /v1/models catalog relay"

[features]
default = []
test-fixtures = []

[dependencies]
axum.workspace = true
futures-util.workspace = true
harness-api.workspace = true
# The tokio test driver is the sessions' interim run host until the harness
# lands; the engine's feature gates it.
promptforge-api-runtime = { workspace = true, features = ["test-support"] }
promptforge-api-types.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
shared-vfs.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
workshop-gateway.workspace = true
workshop-menu.workspace = true
workshop-protocol.workspace = true
workshop-registry.workspace = true
workshop-support.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-tungstenite.workspace = true
tower.workspace = true
workshop-gateway = { workspace = true, features = ["test-fixtures"] }
workshop-status.workspace = true

[lints]
workspace = true
