[package]
name = "promptforge-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge shared vocabulary: run events and metrics, model, wire, tool, capability, and naming types, run identity and replay, untrusted guards, and the polled cancellation tree"
readme = "README.md"
keywords = ["prompt", "llm", "cancellation", "observability"]
categories = ["rust-patterns"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The guard nonce's one-way derivation from the run seed.
sha2.workspace = true
thiserror.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# Surface items' doc examples name `promptforge::` paths, the only paths
# other crates see; only this crate's doctest run executes them.
promptforge.workspace = true
# The property tests' adversarial content and Harness-style random seeds;
# the engine itself reads no RNG.
rand.workspace = true
# The reference the std-only `Timestamp::to_rfc3339` formatter is checked
# against; the engine itself never depends on `time`.
time.workspace = true

[lints]
workspace = true
