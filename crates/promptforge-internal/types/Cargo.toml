[package]
name = "promptforge-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge shared host-support primitives: untrusted guards, the polled cancellation tree, and the run event vocabulary"
readme = "README.md"
keywords = ["prompt", "llm", "cancellation", "observability"]
categories = ["rust-patterns"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
serde.workspace = true
serde_json.workspace = true
shared-vfs.workspace = true
thiserror.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# The property tests' adversarial content and host-style random seeds;
# the engine itself reads no RNG.
rand.workspace = true
# The reference the std-only `Timestamp::to_rfc3339` formatter is checked
# against; the engine itself never depends on `time`.
time.workspace = true

[lints]
workspace = true
