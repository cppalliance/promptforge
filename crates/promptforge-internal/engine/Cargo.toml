[package]
name = "promptforge-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["promptforge", "prompt", "llm", "agent", "ai"]
categories = ["development-tools", "text-processing", "api-bindings"]

description = "PromptForge API: prompt parser and the sans-IO Run state machine that executes sections as effects a host performs"
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
promptforge-lua.workspace = true
promptforge-model-client.workspace = true
promptforge-parser.workspace = true
promptforge-store.workspace = true
promptforge-types.workspace = true
promptforge-vfs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
mlua.workspace = true
# The one runtime the engine names, and only for the tokio test driver
# behind `test-support`; the engine proper performs no I/O.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"], optional = true }
workspace-hack.workspace = true

[features]
# The engine's own test drivers, for companion crates' suites: the serial
# sans-IO driver (`test_support::drive`) that performs a run's effects
# through a caller's closure with no runtime and no HTTP, and the tokio
# driver (`test_support::drive_tokio`) that performs them through a
# caller's async performers - the only thing in this crate that needs
# tokio. No production dependent enables it: this crate's own bench and
# the companion crates' suites do, as dev-dependencies.
test-support = ["dep:tokio"]

[dev-dependencies]
# The suites write their fixture tools and brokers as `async fn` under the
# macro; the traits themselves are declared in its expanded form.
async-trait.workspace = true
axum.workspace = true
# The buffer `reqwest` yields per body chunk, named as the mock-gateway
# client's chunk type for the shared read loop.
bytes.workspace = true
criterion.workspace = true
promptforge-lua = { workspace = true, features = ["test-support"] }
promptforge-parser = { workspace = true, features = ["test-support"] }
# The suites' mock-gateway chat client: the one HTTP the engine's own
# tests do, speaking the wire vocabulary to the axum mock. Dev-only; the
# engine never performs a round.
reqwest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# The bench drives runs through the tokio test driver, so it needs the
# feature that provides it.
[[bench]]
name = "models_loop"
harness = false
required-features = ["test-support"]

[lints]
workspace = true
