[package]
name = "promptforge-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["promptforge", "prompt", "llm", "agent", "ai"]
categories = ["development-tools", "text-processing", "api-bindings"]

description = "PromptForge API: the sans-IO Run state machine that executes a parsed prompt's sections as effects the Harness performs"
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
promptforge-lua.workspace = true
promptforge-model-client.workspace = true
promptforge-parser.workspace = true
promptforge-types.workspace = true
promptforge-vfs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
mlua.workspace = true
# The one runtime the Engine names, and only for the tokio test driver
# behind `test-support`; the Engine proper performs no I/O.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"], optional = true }
workspace-hack.workspace = true

[features]
# The Engine's own test drivers, for `benches/models_loop.rs` alone, which
# names this feature in `required-features`: the serial sans-IO driver
# (`test_support::drive`) that performs a run's effects through a caller's
# closure with no runtime and no HTTP, and the tokio driver
# (`test_support::drive_tokio`) that performs them through a caller's async
# performers - the only thing in this crate that needs tokio. No other
# crate enables it.
test-support = ["dep:tokio"]

[dev-dependencies]
# The suites write their fixture tools as `async fn` under the macro; the
# fixture tool trait itself is declared in its expanded form.
async-trait.workspace = true
criterion.workspace = true
promptforge-lua = { workspace = true, features = ["test-support"] }
promptforge-parser = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

# The bench drives runs through the tokio test driver, so it needs the
# feature that provides it.
[[bench]]
name = "models_loop"
harness = false
required-features = ["test-support"]

[lints]
workspace = true
