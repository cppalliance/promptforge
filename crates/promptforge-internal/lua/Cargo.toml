[package]
name = "promptforge-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge sandboxed Lua runtime: the section VM, coroutine protocol, and host surface"
readme = "README.md"
keywords = ["prompt", "llm", "lua", "sandbox", "scripting"]
categories = ["text-processing", "api-bindings"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
mlua.workspace = true
promptforge-model-client.workspace = true
promptforge-store.workspace = true
promptforge-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
workspace-hack.workspace = true

[features]
# Test-only installs and helpers for companion crates' suites and this
# crate's bench (`tools.call_as_model`, `SectionVm::run_chunk`,
# `ToolSet::for_test`); never enabled by a production dependent.
test-support = []

[dev-dependencies]
criterion.workspace = true
promptforge-vfs.workspace = true

# The bench runs chunks through `SectionVm::run_chunk`, a test-support
# helper.
[[bench]]
name = "surface"
harness = false
required-features = ["test-support"]

[lints]
workspace = true
