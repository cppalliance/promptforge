[package]
name = "promptforge-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
mlua.workspace = true
promptforge-model-client.workspace = true
promptforge-types.workspace = true
promptforge-vfs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
workspace-hack.workspace = true

[features]
# Test-only installs and helpers for companion crates' suites and this
# crate's bench (`tools.call_as_model`, `SectionVm::run_chunk`,
# `ToolSet::for_test`); never enabled by a production dependent.
test-support = []

[dev-dependencies]
criterion.workspace = true

# The bench runs chunks through `SectionVm::run_chunk`, a test-support
# helper.
[[bench]]
name = "surface"
harness = false
required-features = ["test-support"]

[build-dependencies]
build-ceiling.workspace = true

[lints]
workspace = true
