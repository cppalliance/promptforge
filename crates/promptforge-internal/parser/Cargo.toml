[package]
name = "promptforge-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
promptforge-lua.workspace = true
promptforge-types.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true

[dev-dependencies]
mlua.workspace = true
promptforge-lua = { workspace = true, features = ["test-support"] }

[features]
# `test_support`, the synthetic section constructors, the prompt source
# builder, and the parse assertions, for companion crates' tests;
# `promptforge-engine` enables it from `[dev-dependencies]` only.
test-support = []

[build-dependencies]
build-ceiling.workspace = true

[lints]
workspace = true
