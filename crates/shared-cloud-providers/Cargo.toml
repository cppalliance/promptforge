[package]
name = "shared-cloud-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge shared cloud provider descriptors: the tiered provider registry, per-provider fetch and normalization behind an injected reqwest client, and the sheet-building binary"
keywords = ["prompt", "llm", "gateway", "providers"]
categories = ["rust-patterns"]
documentation = "https://cppalliance.github.io/promptforge/"

[lib]
name = "shared_cloud_providers"
path = "src/lib.rs"

[[bin]]
name = "shared-cloud-providers"
path = "src/main.rs"

[dependencies]
reqwest.workspace = true
shared-gateway-api.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
