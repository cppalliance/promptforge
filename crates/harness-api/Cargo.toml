[package]
name = "harness-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge harness door: the public surface through which Workshop and other clients configure the harness, push the gateway binding, and drive agent sessions"
readme = "README.md"
keywords = ["promptforge", "llm", "agent", "harness", "sessions"]
categories = ["development-tools", "api-bindings"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
harness-capabilities.workspace = true
harness-models.workspace = true
# The awaitable cancel token (`cancel::CancelHandle`) a client selects
# over, re-exported from the runner.
harness-runner.workspace = true
# The harness handle, its bindings, the session handle, and the session
# vocabulary, all defined there and named through this door.
harness-sessions.workspace = true
workspace-hack.workspace = true

[lints]
workspace = true
