[package]
name = "harness-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge harness door: the public surface through which Workshop and other clients configure the harness, push the gateway binding, and drive agent sessions"
readme = "README.md"
keywords = ["promptforge", "llm", "agent", "harness", "sessions"]
categories = ["development-tools", "api-bindings"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
harness-capabilities.workspace = true
harness-models.workspace = true
# The interim bridge registers the first-party capability for
# `workshop-sessions`; the dependency leaves with the bridge once
# `harness-sessions` owns registration.
harness-web.workspace = true
promptforge-api-types.workspace = true
serde.workspace = true
serde_json.workspace = true
# The awaitable cancel token (`cancel::CancelHandle`) a client selects
# over: a `CancellationToken` plus the task-local scope it installs in.
tokio = { workspace = true, features = ["sync", "rt"] }
tokio-util.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
