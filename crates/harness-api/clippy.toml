# A per-crate clippy.toml replaces the workspace root's rather than merging
# with it, so the root's test allowances are restated here.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# The harness spawns only through the instrumented wrapper in
# harness-runner, which tags each task with its EffectId and Provenance.
# `cargo test -p build-xtask` checks that every harness crate names both
# methods. allow-invalid: this crate does not depend on tokio, so the paths
# do not resolve here; the ban must still be declared for the check.
disallowed-methods = [
    { path = "tokio::spawn", reason = "spawn through harness-runner's instrumented wrapper", allow-invalid = true },
    { path = "tokio::task::spawn_blocking", reason = "spawn through harness-runner's instrumented wrapper", allow-invalid = true },
]
