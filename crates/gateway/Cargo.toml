[package]
name = "gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge inference gateway: routes OpenAI-shaped chat completions to a backend"
readme = "README.md"
keywords = ["llm", "gateway", "openai", "proxy", "gguf"]
categories = ["web-programming::http-server"]
documentation = "https://cppalliance.github.io/promptforge/"

[[bin]]
name = "promptforge-gateway"
path = "src/main.rs"

[dependencies]
axum.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
# TTY progress bars drawn by the renderer task.
indicatif.workspace = true
# GPU name and VRAM for GET /admin/system; probes NVML at runtime, so builds
# and machines without an NVIDIA driver keep working.
nvml-wrapper.workspace = true
promptforge-core.workspace = true
gateway-config.workspace = true
# Optional: the embedded config UI SPA served at /config/ behind the
# `config-ui` feature; headless builds never pull rust-embed or the Node
# esbuild pipeline.
gateway-config-ui = { workspace = true, optional = true }
# Optional: gateway-owned local inference (GGUF provisioning, managed
# `llama-server` children, blob cache store). Headless builds disable it.
gateway-local = { workspace = true, optional = true }
# The first-run bearer key (src/boot.rs) comes from the OS-seeded CSPRNG.
rand.workspace = true
# The shared loopback wall for the admin config endpoints; always on,
# because those endpoints hold secrets in every build.
shared-loopback.workspace = true
shared-protocol.workspace = true
# The connection-file seam: gateway.json is written after every successful
# bind, in every build, so the workshop can discover a running gateway.
shared-sidecar.workspace = true
gateway-routing.workspace = true
# The serde feature wires the progress event stream onto HTTP.
shared-progress = { workspace = true, features = ["serde"] }
# Optional: gateway-hosted speech-to-text (engine lifecycle, the
# `/v1/audio/transcriptions` route), behind the default-on `stt` feature.
gateway-stt = { workspace = true, optional = true }
gateway-web-search = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Host CPU/RAM/disk metrics for GET /admin/system.
sysinfo.workspace = true
subtle.workspace = true
# JSON-to-TOML conversion for the shadow-write admin routes; already in the
# tree via gateway-config.
toml.workspace = true
url.workspace = true
reqwest = { workspace = true, features = ["stream"] }
thiserror.workspace = true
# RFC 3339 rendering of the connection file's started_at.
time.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# First-run STT gating reads the installer's registry choice (src/boot.rs):
# RegOpenKeyExW + RegQueryValueExW.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[features]
default = ["local", "web-search", "config-ui", "stt"]
# Gateway-owned local inference via the `gateway-local` crate.
local = ["dep:gateway-local"]
# The Brave-powered `POST /v1/tools/web_search` tool service.
web-search = ["dep:gateway-web-search"]
# Serve the embedded config UI SPA at /config/ on the gateway's own port,
# loopback-only. Default, so plain builds need Node 22 for the SPA's esbuild
# pipeline; --no-default-features builds skip the SPA crate entirely.
config-ui = ["dep:gateway-config-ui"]
# Gateway-hosted speech-to-text via the `gateway-stt` crate: the engine
# lifecycle and `POST /v1/audio/transcriptions` on the gateway listener.
# Default on, so every default build ships STT; a --no-default-features
# build stubs the route and refuses a configuration declaring [[stt_model]].
stt = ["dep:gateway-stt"]

[dev-dependencies]
# Encodes the generated test image for the live CUDA projector proof.
png.workspace = true
# test-util pauses time so the progress heartbeat test runs instantly.
tokio = { workspace = true, features = ["test-util"] }
gateway-routing = { workspace = true, features = ["test-helpers"] }
tempfile.workspace = true
# Drives build_router in-process with forged peer addresses, so the
# loopback-wall tests can present a LAN peer no real TCP connection could.
tower.workspace = true

# Not `workspace = true`: the registry shim in src/boot.rs is raw Win32 FFI
# and cannot be written without unsafe, and a workspace `forbid` cannot be
# overridden by a module allow. The workspace lint set is mirrored with
# unsafe_code lowered to deny, which the shim module alone opts out of.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
doc_markdown = "allow"

# Release packaging through cargo-dist (see dist-workspace.toml): the
# sample systemd unit rides in the archive.
[package.metadata.dist]
dist = true
include = ["packaging/gateway.service"]
