[package]
name = "gateway-local"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
flate2.workspace = true
gateway-config.workspace = true
gateway-protocol.workspace = true
gateway-routing.workspace = true
gateway-progress.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
shared-error-source = { workspace = true, features = ["http", "json"] }
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
# CancellationToken for the cancellable provisioning path (the gateway's
# command queue); default-features off, the sync module is ungated.
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
zip.workspace = true
workspace-hack.workspace = true

[features]
test-fixtures = []

[dev-dependencies]
minijinja.workspace = true
minijinja-contrib.workspace = true
gateway-routing = { workspace = true, features = ["test-helpers"] }
tempfile.workspace = true

[lints]
workspace = true

