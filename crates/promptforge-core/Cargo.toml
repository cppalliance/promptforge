promptforge-model-client.workspace = true
promptforge-parser.workspace = true
promptforge-store.workspace = true
promptforge-tool-picker.workspace = true
promptforge-tools.workspace = true
promptforge-web-search.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
mlua.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
axum.workspace = true
promptforge-parser = { workspace = true, features = ["test-support"] }
tokio.workspace = true

[lints]
workspace = true
