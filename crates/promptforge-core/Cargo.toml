[package]
name = "promptforge-core"
# Private, unpublished crate: pinned to 0.0.0 rather than inheriting the
# workspace release version, so it is never mistaken for a released 0.1.0
# (MANIFEST-001). The workspace dependency entry is pinned to 0.0.0 to match.
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["prompt", "llm", "ai", "runtime", "openai"]
categories = ["text-processing", "api-bindings"]
publish = false
description = "PromptForge runtime core: prompt parser, HTTP client, section execution"

[dependencies]
async-trait.workspace = true
promptforge-tool-picker.workspace = true
rand.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
reqwest.workspace = true
thiserror.workspace = true
url.workspace = true
mlua.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
axum.workspace = true
tokio.workspace = true

[lints]
workspace = true
