[package]
name = "promptforge-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "PromptForge MCP server: publishes prompts to an agentic harness as callable tools"

[dependencies]
arc-swap.workspace = true
axum.workspace = true
fastrand.workspace = true
glob.workspace = true
humantime-serde.workspace = true
notify.workspace = true
promptforge-core.workspace = true
promptforge-tool-picker = { workspace = true, optional = true }
promptforge-webfetch.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["picker"]
# Spelled with `dep:` so the implicit optional-dependency feature does not leak
# into the public feature set.
picker = ["dep:promptforge-tool-picker"]

[lints]
workspace = true
