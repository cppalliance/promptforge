[package]
name = "promptforge-ws"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge Workshop desktop window shell"

[[bin]]
name = "promptforge-ws"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
open.workspace = true
png.workspace = true
promptforge-ws-server.workspace = true
serde_json.workspace = true
tao.workspace = true
url.workspace = true
wry.workspace = true

# The delegating OLE drop target (src/drop_target.rs): wry's own drag-drop
# handler revokes WebView2's drop target, which kills HTML5 drag-and-drop
# inside the page, so the shell wraps Chromium's target itself. The version
# and features mirror wry's, keeping one `windows` build in the tree.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# The #[implement] macro expands to paths in `windows_core`, so the crate
# must be a direct dependency (wry declares it the same way).
[target.'cfg(target_os = "windows")'.dependencies.windows-core]
version = "0.61"

[features]
# CUDA by default: the desktop app is voice-capable out of the box, at the
# cost of requiring the NVIDIA CUDA toolkit to build. A machine without it
# builds with --no-default-features (voice then stays off at runtime).
default = ["cuda"]
cuda = ["promptforge-ws-server/cuda"]

[dev-dependencies]
tempfile.workspace = true

# Not `workspace = true`: the delegating OLE drop target (drop_target.rs)
# is raw Win32/COM and cannot be written without unsafe, and a workspace
# `forbid` cannot be overridden by a module allow. The workspace lint set
# is mirrored with unsafe_code lowered to deny, which drop_target.rs alone
# opts out of.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
doc_markdown = "allow"
