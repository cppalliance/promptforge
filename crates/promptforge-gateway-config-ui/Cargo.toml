[package]
name = "promptforge-gateway-config-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge gateway config UI: embedded SPA assets and the shared loopback middleware, mounted by the gateway at /config"

[dependencies]
axum.workspace = true
rust-embed.workspace = true

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower.workspace = true

# The build script's release path verifies the packaged UI artifact
# (build/manifest.rs): serde_json parses the manifest, sha2 recomputes the
# input hash. Both are repeated in dev-dependencies so the verifier's unit
# tests (included into the library under cfg(test)) link.
[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
