[package]
name = "promptforge-dev"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "Interactive PromptForge prompt runner against an already-running gateway"
readme = "README.md"
keywords = ["promptforge", "prompt", "llm", "gateway", "cli"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://cppalliance.github.io/promptforge/"

[[bin]]
name = "promptforge-dev"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
fastrand.workspace = true
notify.workspace = true
promptforge-core.workspace = true
promptforge-tool-picker.workspace = true
promptforge-webfetch.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "signal", "sync", "time"] }

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
