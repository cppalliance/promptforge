[package]
name = "promptforge-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Interactive PromptForge prompt runner against an already-running gateway"

[[bin]]
name = "promptforge-dev"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
fastrand.workspace = true
notify.workspace = true
promptforge-core.workspace = true
promptforge-tool-picker.workspace = true
promptforge-webfetch.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
