[package]
name = "promptforge-workshop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge Workshop desktop app: boots the gateway and opens the workshop window"

[[bin]]
name = "promptforge-workshop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
promptforge-desktop-shell.workspace = true
# config-ui is a gateway default already; naming it here pins the desktop
# exe to carry the config UI even if the default edge is ever severed.
promptforge-gateway = { workspace = true, features = ["workshop", "config-ui"] }
rand.workspace = true

[features]
# CUDA by default: the desktop app is voice-capable out of the box, at the
# cost of requiring the NVIDIA CUDA toolkit to build. A machine without it
# builds with --no-default-features (voice then stays off at runtime).
default = ["cuda"]
cuda = ["promptforge-gateway/workshop-cuda"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
