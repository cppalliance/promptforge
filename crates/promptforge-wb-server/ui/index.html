<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptForge</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">PromptForge</div>
    <label class="picker-label" for="model-picker">Model</label>
    <select id="model-picker" class="picker" disabled>
      <option>Loading&hellip;</option>
    </select>
    <div id="model-description" class="model-description"></div>
  </aside>
  <main class="chat">
    <div id="messages" class="messages" aria-live="polite"></div>
    <div id="interim" class="interim" aria-live="polite"></div>
    <form id="composer" class="composer">
      <button id="mic" type="button" class="mic-button" title="Push to talk" aria-label="Push to talk" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10a7 7 0 0 0 14 0"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>
      <textarea id="input" rows="1" placeholder="Message&hellip;" autocomplete="off"></textarea>
      <button id="send" type="submit" title="Send (Enter)" disabled>Send</button>
    </form>
    <div id="voice-status" class="voice-status" role="status" aria-live="polite"></div>
  </main>
</div>
<script src="/markdown-it.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
