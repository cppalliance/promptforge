[package]
name = "gateway-api-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
shared-error-source = { workspace = true, features = ["json"] }
thiserror.workspace = true
workspace-hack.workspace = true

# Process-image lookup for stale detection (src/sys/macos.rs): proc_pidpath.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# Process-image lookup for stale detection (src/sys/windows.rs):
# OpenProcess + QueryFullProcessImageNameW.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[features]
# Cross-crate test seam: exposes `resolve_for_test`, so a consumer's test
# binary (never named `promptforge-gateway`) can run the full liveness
# gauntlet against its own process image.
test-fixtures = []

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
