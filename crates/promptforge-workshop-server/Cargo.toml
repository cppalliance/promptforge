[package]
name = "promptforge-workshop-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "PromptForge Workshop HTTP server: serves the workshop API to the desktop shell"

[[bin]]
name = "promptforge-workshop-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
dunce.workspace = true
futures-util.workspace = true
open.workspace = true
percent-encoding.workspace = true
promptforge-core-support.workspace = true
promptforge-model-client.workspace = true
promptforge-progress.workspace = true
promptforge-store.workspace = true
promptforge-tools.workspace = true
rand.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
workshop-agent.workspace = true

[features]
default = []
test-fixtures = []

[dev-dependencies]
promptforge-workshop-server = { path = ".", features = ["test-fixtures"] }
tempfile.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tower.workspace = true

# The build script's release path verifies the packaged UI artifact
# (build/manifest.rs): serde_json parses the manifest, sha2 recomputes the
# input hash. sha2 is repeated in dev-dependencies so the verifier's unit
# tests (compiled into the library under cfg(test)) link.
[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
