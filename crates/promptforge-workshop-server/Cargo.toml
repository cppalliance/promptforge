[package]
name = "promptforge-workshop-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge Workshop HTTP server: serves the workshop API to the desktop shell"

[[bin]]
name = "promptforge-workshop-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
dunce.workspace = true
futures-util.workspace = true
open.workspace = true
percent-encoding.workspace = true
promptforge-gateway-client.workspace = true
promptforge-gateway-protocol.workspace = true
promptforge-progress.workspace = true
promptforge-transcribe.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[features]
default = []
# GPU voice transcription: the transcription engine's CUDA backend.
voice-cuda = ["promptforge-transcribe/cuda"]
# Compatibility alias for voice-cuda; existing invocations keep working.
cuda = ["voice-cuda"]
# Compiles the engine's test fixtures and re-exports them to the
# integration-test binary; enabled for every test build by the self
# dev-dependency below, never by production consumers.
test-fixtures = ["promptforge-transcribe/test-fixtures"]

[dev-dependencies]
# The crate dev-depends on itself so every test target - unit and
# integration alike - builds the library with test-fixtures enabled,
# without gate commands needing a --features flag.
promptforge-workshop-server = { path = ".", features = ["test-fixtures"] }
tempfile.workspace = true
sha2.workspace = true
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tower.workspace = true

# The build script's release path verifies the packaged UI artifact
# (build/manifest.rs): serde_json parses the manifest, sha2 recomputes the
# input hash. sha2 is repeated in dev-dependencies so the verifier's unit
# tests (compiled into the library under cfg(test)) link.
[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
