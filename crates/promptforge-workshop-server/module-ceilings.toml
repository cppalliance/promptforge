# Module size ratchet for promptforge-workshop-server. Enforced by the `ratchet`
# module of the tests/it integration binary; a module that outgrows its
# ceiling fails `cargo test -p promptforge-workshop-server --test it`.
#
# Counting rule: physical lines, the count diff tooling reports - every
# newline ends a line, and a final line missing its trailing newline still
# counts as one. Blank lines and comments count; this is a tripwire against
# regrowth, not a code-quality metric.
#
# Slack: the test lets a module run up to 30 lines past its ceiling (the
# SLACK constant in tests/it/ratchet.rs). A fixed count rather than a
# percentage, because a percentage would hand the largest modules - the ones
# the ratchet exists to contain - the most free growth.
#
# Raising a ceiling: edit the number here in the same commit as the growth,
# and state the reason in that commit's message. Never raise a ceiling to
# quiet the test in an unrelated commit.
#
# New and deleted modules: every .rs file under src/ has exactly one entry
# here. The test fails on a missing entry (a new module ships with a
# recorded ceiling) and on a stale one (a deleted module takes its entry
# with it).
#
# Shrinking is free and never fails the test; after a big shrink, re-record
# the ceiling downward in the same commit to bank the gain.

[modules]
# `AppState::new` owns only Workshop server state. Gateway-owned STT attaches
# its routes after construction.
"app.rs" = 387
"assets.rs" = 69
"atomic.rs" = 230
"backoff.rs" = 232
"catalog.rs" = 118
"config.rs" = 634
"cross_site.rs" = 338
"deadline.rs" = 112
# Grew by the revoke seam: the `NotGranted` variant's wire mapping (404,
# `not_granted`) and its case in the seam test.
"error.rs" = 517
# Grew by the config-panel proxy seam: the `base_url` accessor,
# `ForwardedResponse`, and the `forward` relay the /gateway/api route
# calls - one more request shape on the same gateway HTTP client.
"gateway.rs" = 1365
# New module: the gateway progress subscriber, importing the gateway's
# /admin/progress event stream into the workshop ProgressHub as a
# RemoteOperation while the heartbeat reads the gateway as reachable.
# Grew by the closable mock feed and injected resubscribe delay (the
# malformed-event skip and stream-end resubscribe tests) - the recorded
# ceiling had also been set four lines under the module's measured size.
"gateway_progress.rs" = 466
# Grew by the join-time status recompute: the transition-label constants and
# the join_status helper (a late-joining session's line comes from the
# current probe, not a stale retained announcement) plus their tests.
"heartbeat.rs" = 969
# New module: the user-input wait machinery - the WaitRegistry of
# single-use cryptographic wait tokens, the Workshop's user_input Tool
# (trusted structured output; a drop guard turns every dying wait into a
# durable input_cancelled frame), and the input_response producer that
# fires on_user_input then completes the wait; roughly half the count is
# its in-file unit tests. Grew by the review round's documentation and
# redaction pins: # Examples doctests on the registry and tool
# constructors (the crate convention) and the Debug-never-shows-a-token
# test - same responsibility, added coverage.
"input.rs" = 791
# Grew by the session split's test seams: the fixtures module now re-exports
# the bus, health, backoff, and heartbeat types the socket behavior tests
# drive directly (visibility cannot be feature-gated, so the re-exports are
# present in every build, doc-hidden). Grew again by the input module's
# declaration and re-exports.
"lib.rs" = 81
"main.rs" = 47
"menu.rs" = 926
# New module: the run event log (WorkshopObserver) - Observer write side,
# EventLog read side, subscribe() broadcast, and versioned JSONL
# persistence with load_from replay; roughly half the count is its
# in-file unit tests, including the review round's persistence-robustness
# pins (CRLF endings load, unknown event kinds refuse to load).
"observer.rs" = 878
# Grew by the agent-session frame family: the agents list, the
# launch/attach acknowledgment, the indexed durable agent_event frame,
# the reply-stamped ephemeral agent_delta frame, and their wire-shape
