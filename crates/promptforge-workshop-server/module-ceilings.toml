# the bus, health, backoff, and heartbeat types the socket behavior tests
# drive directly (visibility cannot be feature-gated, so the re-exports are
# present in every build, doc-hidden).
"lib.rs" = 80
"main.rs" = 47
"menu.rs" = 926
"protocol.rs" = 738
# New module: the ProgressHub-to-status-bar renderer and its anti-flicker
# state machine (show delay, minimum visible time, detach poll). Grew by
# the lapsed-deadline detach poll (a past wake instant re-armed would spin
# the select loop) and its two pinning tests. Grew again by the
# minimum-visible backward-step floor (a new operation attaching during the
# hold continues from the drained level) and the lagged-receiver,
# pre-subscription catch, and backward-step tests.
"progress.rs" = 500
# Grew by the provision migration to tree leaves: `cache_fetch` applies
