[package]
name = "promptforge-desktop-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge Workshop desktop shell: windowing, WebView, IPC, and platform bridges"

[dependencies]
anyhow.workspace = true
open.workspace = true
png.workspace = true
serde_json.workspace = true
tao.workspace = true
url.workspace = true
wry.workspace = true

# Explorer path drops (src/file_drop.rs): the page posts dropped File
# objects over the WebView2 web-message channel and the shell reads their
# real OS paths from ICoreWebView2File. The versions mirror wry's, keeping
# one build of each crate in the tree.
[target.'cfg(target_os = "windows")'.dependencies.webview2-com]
version = "0.38"

[target.'cfg(target_os = "windows")'.dependencies.windows-core]
version = "0.61"

# Native folder picker for the workspace-pick-folder web message. Windows
# only: the page requests the picker over the WebView2 web-message channel,
# which exists only there; other platforms answer the request with nothing
# and the page keeps its manual path-input fallback.
[target.'cfg(target_os = "windows")'.dependencies.rfd]
workspace = true

# Not `workspace = true`: the WebView2 file-drop bridge (file_drop.rs) is
# raw COM and cannot be written without unsafe, and a workspace `forbid`
# cannot be overridden by a module allow. The workspace lint set is
# mirrored with unsafe_code lowered to deny, which file_drop.rs alone opts
# out of.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
doc_markdown = "allow"
