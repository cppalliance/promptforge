[package]
name = "harness-gateway-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge Gateway client: the HTTP client and the OpenAI chat-completions wire code that turn a Chat effect into a streamed round against the Gateway"
readme = "README.md"
keywords = ["promptforge", "llm", "gateway", "openai", "sse"]
categories = ["web-programming::http-client"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
# The Engine's public API: the chat vocabulary (Message, ToolSchema,
# Completion, CompletionError) the wire code reads and builds through its
# public constructors, and the canonical metrics, model catalog, and delta
# vocabulary.
promptforge.workspace = true
# Names `bytes::Bytes`, the buffer `reqwest` yields per body chunk, as the
# reassembly's chunk type so no chunk is copied on its way in.
bytes.workspace = true
reqwest.workspace = true
# Derives the private wire shapes of the `usage` and llama.cpp `timings`
# metadata sections, and of the `GET /v1/models` list.
serde.workspace = true
# The request body, every streamed payload, and the reassembled response
# are JSON.
serde_json.workspace = true
thiserror.workspace = true
# `time` for the per-receive timeout. Non-test code spawns no task.
tokio = { workspace = true, features = ["time"] }
url.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# The mock gateways the client tests send real rounds to.
axum.workspace = true
# The raw-socket mocks read the request and write paced or truncated
# responses by hand.
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
