[package]
name = "promptforge-stt"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge gateway-owned speech-to-text runtime and HTTP endpoints"

[dependencies]
axum.workspace = true
futures-util.workspace = true
hound.workspace = true
promptforge-gateway-config.workspace = true
promptforge-gateway-local.workspace = true
promptforge-progress.workspace = true
promptforge-transcribe.workspace = true
promptforge-workshop-server.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
default = []
cuda = ["promptforge-transcribe/cuda"]
test-fixtures = ["promptforge-transcribe/test-fixtures"]

[dev-dependencies]
promptforge-stt = { path = ".", features = ["test-fixtures"] }
sha2.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true

[lints]
workspace = true
