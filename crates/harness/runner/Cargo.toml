[package]
name = "harness-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge harness runner: the effect loop that drives an engine Run on tokio, the performer traits, cancellation, supervision, and the one instrumented spawn wrapper"
readme = "README.md"
keywords = ["promptforge", "llm", "agent", "harness", "tokio"]
categories = ["development-tools", "asynchronous"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
harness-capabilities.workspace = true
harness-log.workspace = true
promptforge-api-runtime.workspace = true
promptforge-api-types.workspace = true
# The run seed is drawn from the OS CSPRNG at preparation: it is the
# untrusted-envelope nonce's source, so it must be unguessable.
rand.workspace = true
serde_json.workspace = true
# The prompt's content hash for the run row, so a transcript can be
# matched to the exact text that produced it.
sha2.workspace = true
shared-vfs.workspace = true
thiserror.workspace = true
# `fs` for the prompt file read at preparation, so launching a run never
# blocks a worker thread; `sync` and `rt` for the awaitable cancel token
# (`cancel::CancelHandle`) and the task-local scope it installs in.
tokio = { workspace = true, features = ["fs", "sync", "rt"] }
tokio-util.workspace = true
tracing.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# The preparation suite hands `prepare_run` a prompt file on disk.
async-trait.workspace = true
tempfile.workspace = true

[features]
# Fixtures for other harness crates' tests (`test_support::mock_tag`);
# nothing here reaches the harness proper.
test-support = []

[lints]
workspace = true
