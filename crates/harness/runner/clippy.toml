# A per-crate clippy.toml replaces the workspace root's rather than merging
# with it, so the root's test allowances are restated here.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# The harness spawns only through the instrumented wrapper in this crate's
# `spawn` module, which tags each task with its EffectId and Provenance.
# `cargo test -p build-xtask` checks that every harness crate names both
# methods. The wrapper functions in `spawn` are the only sites allowed to
# call them, each under an explicit `#[allow(clippy::disallowed_methods)]`.
disallowed-methods = [
    { path = "tokio::spawn", reason = "spawn through harness-runner's instrumented wrapper" },
    { path = "tokio::task::spawn_blocking", reason = "spawn through harness-runner's instrumented wrapper" },
]
