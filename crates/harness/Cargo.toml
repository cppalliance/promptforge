[package]
name = "harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge harness public API: the surface through which Workshop and other clients configure the harness, push the gateway binding, and drive agent sessions"
documentation = "https://cppalliance.github.io/promptforge/harness/harness/index.html"

# Every crate that defines a re-exported item: each `pub use` names the
# defining crate's path. The engine's types a harness signature names are
# re-exported through the `promptforge` facade, their one public path.
[dependencies]
harness-capabilities.workspace = true
harness-log.workspace = true
harness-runner.workspace = true
harness-sessions.workspace = true
promptforge.workspace = true
workspace-hack.workspace = true

# The doc examples run a host on tokio, as a real host does; the facade's
# own items name no tokio type.
[dev-dependencies]
tokio = { workspace = true, features = ["signal"] }

[lints]
workspace = true
