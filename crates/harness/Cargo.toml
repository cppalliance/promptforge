[package]
name = "harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge Harness public API: the surface through which Workshop and other Hosts build one Harness per run, supply its recorder, inference broker, timer, and capabilities, and steer the run"
documentation = "https://cppalliance.github.io/promptforge/harness/harness/index.html"

# Every crate that defines a re-exported item: each `pub use` names the
# defining crate's path. The Engine's types a Harness signature names are
# re-exported through the `promptforge` facade, their one public path.
[dependencies]
harness-capabilities.workspace = true
harness-runner.workspace = true
promptforge.workspace = true
workspace-hack.workspace = true

# The suite and the `run-prompt` example run a Host on tokio, as a real
# Host does; the facade's own items name no tokio type. The suite
# implements `InputBroker`, an `async_trait` trait.
[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "time"] }

[lints]
workspace = true
