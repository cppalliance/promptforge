[package]
name = "harness-sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge harness sessions: agent discovery, session state, input waits, and the supervisor state machine behind the harness door"
readme = "README.md"
keywords = ["promptforge", "llm", "agent", "harness", "sessions"]
categories = ["development-tools", "api-bindings"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
# Per-run activation of the prompt's declared capabilities against the
# registry rebuilt for each gateway generation.
harness-capabilities.workspace = true
# The run log every session run is recorded in and read back from for
# transcripts and reconnect.
harness-log.workspace = true
# The gateway model client and the chat performer over it, rebuilt with
# the capability registry when the gateway generation changes.
harness-models.workspace = true
# The effect loop a session drives its runs through, the performer trait
# the input broker implements, and the instrumented spawn wrapper.
harness-runner.workspace = true
# The first-party `promptforge/web` capability (fetch and search): this
# crate is the one place a provider crate is named, at registration.
harness-web.workspace = true
# The engine door: the input outcome and error vocabulary a `UserInput`
# effect is answered with, the run context, and the run limits.
promptforge-api-runtime.workspace = true
promptforge-api-types.workspace = true
# Wait tokens and session ids are 128 bits from the OS CSPRNG:
# unguessable by anything that has not seen the announcing frame.
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
shared-vfs.workspace = true
thiserror.workspace = true
# `sync` for the supervisor's typed event queues (`mpsc`), the wait
# registry's `oneshot` and `broadcast` channels, and the binding
# generation watches; `fs` for the state directory the run log opens in.
tokio = { workspace = true, features = ["sync", "fs"] }
tracing.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# The tag fixture the input suite spawns its suspended waits under.
harness-runner = { workspace = true, features = ["test-support"] }
# The discovery and session suites seed an agents directory on disk.
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
