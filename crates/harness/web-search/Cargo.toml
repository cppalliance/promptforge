[package]
name = "harness-web-search"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge web_search tool: proxy a search query through the gateway so the vendor credential never leaves the server"
readme = "README.md"
keywords = ["promptforge", "llm", "tools", "search", "ai"]
categories = ["web-programming::http-client", "api-bindings"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
harness-capabilities.workspace = true
# The engine's public API: tool id, output, and error vocabulary.
promptforge.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
thiserror.workspace = true
url.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
axum.workspace = true
# The tests spawn their mock gateways through the harness's instrumented
# spawn wrapper, never `tokio::spawn` (see clippy.toml), under the tag
# fixture `test-support` provides.
harness-runner = { workspace = true, features = ["test-support"] }
# `io-util` is the `AsyncReadExt`/`AsyncWriteExt` the raw TCP mock frames its
# truncated response with.
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
