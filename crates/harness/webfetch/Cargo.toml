[package]
name = "harness-webfetch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge web_fetch tool: fetch a URL and return its main content as markdown"
readme = "README.md"
keywords = ["http", "fetch", "web", "ssrf", "readability"]
categories = ["web-programming::http-client"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
harness-capabilities.workspace = true
promptforge-api-types.workspace = true
async-trait.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["gzip", "brotli"] }
readabilityrs.workspace = true
htmd.workspace = true
mime.workspace = true
encoding_rs.workspace = true
url.workspace = true
ipnet.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true }
workspace-hack.workspace = true

[dev-dependencies]
# The tests spawn their mock servers through the harness's instrumented
# spawn wrapper, never `tokio::spawn` (see clippy.toml), under the tag
# fixture `test-support` provides.
harness-runner = { workspace = true, features = ["test-support"] }
tokio.workspace = true
axum.workspace = true
flate2.workspace = true
futures-util.workspace = true

[lints]
workspace = true
