[package]
name = "promptforge-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "PromptForge inference gateway: routes OpenAI-shaped chat completions to a backend"
readme = "README.md"
keywords = ["llm", "gateway", "openai", "proxy", "gguf"]
categories = ["web-programming::http-server"]
documentation = "https://cppalliance.github.io/promptforge/"

[[bin]]
name = "promptforge-gateway"
path = "src/main.rs"

[dependencies]
axum.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
# TTY progress bars drawn by the renderer task.
indicatif.workspace = true
# GPU name and VRAM for GET /admin/system; probes NVML at runtime, so builds
# and machines without an NVIDIA driver keep working.
nvml-wrapper.workspace = true
# Optional: opens the system browser at the hosted workshop URL.
open = { workspace = true, optional = true }
promptforge-core.workspace = true
promptforge-gateway-config.workspace = true
# Optional: the embedded config UI SPA served at /config/ behind the
# `config-ui` feature; headless builds never pull rust-embed or the Node
# esbuild pipeline.
promptforge-gateway-config-ui = { workspace = true, optional = true }
# Optional: gateway-owned local inference (GGUF provisioning, managed
# `llama-server` children, blob cache store). Headless builds disable it.
promptforge-gateway-local = { workspace = true, optional = true }
# The shared loopback wall for the admin config endpoints; always on,
# because those endpoints hold secrets in every build.
promptforge-gateway-loopback.workspace = true
promptforge-gateway-protocol.workspace = true
promptforge-gateway-routing.workspace = true
# The serde feature wires the progress event stream onto HTTP.
promptforge-progress = { workspace = true, features = ["serde"] }
promptforge-stt = { workspace = true, optional = true }
promptforge-web-search-service = { workspace = true, optional = true }
promptforge-workshop-server = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Host CPU/RAM/disk metrics for GET /admin/system.
sysinfo.workspace = true
subtle.workspace = true
# JSON-to-TOML conversion for the shadow-write admin routes; already in the
# tree via promptforge-gateway-config.
toml.workspace = true
url.workspace = true
reqwest = { workspace = true, features = ["stream"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = ["local", "web-search", "config-ui"]
# Gateway-owned local inference via the `promptforge-gateway-local` crate.
local = ["dep:promptforge-gateway-local"]
# The Brave-powered `POST /v1/tools/web_search` tool service.
web-search = ["dep:promptforge-web-search-service"]
# Serve the embedded config UI SPA at /config/ on the gateway's own port,
# loopback-only. Default, so plain builds need Node 22 for the SPA's esbuild
# pipeline; --no-default-features builds skip the SPA crate entirely.
config-ui = ["dep:promptforge-gateway-config-ui"]
# Host the workshop UI server on a second loopback listener. The default
# stays empty so headless gateway builds never pull speech-to-text or the
# Node UI build into the graph.
workshop = ["dep:promptforge-stt", "dep:promptforge-workshop-server", "dep:open"]

[dev-dependencies]
# Encodes the generated test image for the live CUDA projector proof.
png.workspace = true
# test-util pauses time so the progress heartbeat test runs instantly.
tokio = { workspace = true, features = ["test-util"] }
promptforge-gateway-routing = { workspace = true, features = ["test-helpers"] }
tempfile.workspace = true
# Drives build_router in-process with forged peer addresses, so the
# loopback-wall tests can present a LAN peer no real TCP connection could.
tower.workspace = true

[lints]
workspace = true

# Release packaging through cargo-dist (see dist-workspace.toml): the
# headless Linux gateway also serves the workshop web pages, so the release
# build turns the workshop feature on; the sample systemd unit rides in the
# archive.
[package.metadata.dist]
features = ["workshop"]
include = ["packaging/promptforge-gateway.service"]

[package.metadata.cargo-semver-checks.lints]
workspace = true
