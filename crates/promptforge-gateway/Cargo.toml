[package]
name = "promptforge-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "PromptForge inference gateway: routes OpenAI-shaped chat completions to a backend"
readme = "README.md"
keywords = ["llm", "gateway", "openai", "proxy", "gguf"]
categories = ["web-programming::http-server"]
documentation = "https://cppalliance.github.io/promptforge/"

[[bin]]
name = "promptforge-gateway"
path = "src/main.rs"

[dependencies]
axum.workspace = true
async-trait.workspace = true
dotenvy.workspace = true
flate2.workspace = true
futures-util.workspace = true
indicatif.workspace = true
# Optional: opens the system browser at the hosted workshop URL.
open = { workspace = true, optional = true }
promptforge-core.workspace = true
promptforge-gateway-config.workspace = true
promptforge-ws-server = { workspace = true, optional = true }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tar.workspace = true
url.workspace = true
reqwest = { workspace = true, features = ["blocking", "stream"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zip.workspace = true

[features]
# Host the workshop UI server on a second loopback listener. The default
# stays empty so headless gateway builds never pull whisper, CUDA, or the
# Node UI build into the graph.
workshop = ["dep:promptforge-ws-server", "dep:open"]
workshop-cuda = ["workshop", "promptforge-ws-server/cuda"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
