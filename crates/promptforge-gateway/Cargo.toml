[package]
name = "promptforge-gateway"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "PromptForge inference gateway: routes OpenAI-shaped chat completions to a backend"
readme = "README.md"
keywords = ["llm", "gateway", "openai", "proxy", "gguf"]
categories = ["web-programming::http-server"]
documentation = "https://cppalliance.github.io/promptforge/"

[[bin]]
name = "promptforge-gateway"
path = "src/main.rs"

[dependencies]
axum.workspace = true
async-trait.workspace = true
flate2.workspace = true
indicatif.workspace = true
promptforge-core.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tar.workspace = true
toml.workspace = true
url.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
