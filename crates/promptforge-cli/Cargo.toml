[package]
name = "promptforge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "PromptForge command-line tool"
readme = "README.md"
keywords = ["promptforge", "prompt", "llm", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://cppalliance.github.io/promptforge/"

[[bin]]
name = "promptforge"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
fastrand.workspace = true
# TTY progress bars drawn while the tool set and model catalog load.
indicatif.workspace = true
promptforge-core.workspace = true
shared-progress.workspace = true
promptforge-tools.workspace = true
promptforge-web-search.workspace = true
promptforge-webfetch.workspace = true
promptforge-tool-picker.workspace = true
tokio = { workspace = true, features = ["fs", "signal"] }

[lints]
workspace = true

# Not released through cargo-dist; the gateway is the only disted package
# (see dist-workspace.toml).
[package.metadata.dist]
dist = false
