[package]
name = "promptforge-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "PromptForge command-line tool"
readme = "README.md"
keywords = ["promptforge", "prompt", "llm", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://cppalliance.github.io/promptforge/"

[[bin]]
name = "promptforge"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
fastrand.workspace = true
promptforge-core.workspace = true
promptforge-webfetch.workspace = true
promptforge-tool-picker.workspace = true
tokio = { workspace = true, features = ["fs", "signal"] }

[lints]
workspace = true
