[package]
name = "harness-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge Harness runner: the per-run Harness, the effect loop that drives an Engine Run as one future, the performer traits, and run preparation"
readme = "README.md"
keywords = ["promptforge", "llm", "agent", "harness"]
categories = ["development-tools", "asynchronous"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
# Runtime-agnostic async: the effect loop's in-flight set
# (`FuturesUnordered` of `Abortable` futures under `catch_unwind`), the
# stop flag's `AtomicWaker`, and the race between a model listing and
# the run's cancel.
futures-util.workspace = true
harness-capabilities.workspace = true
# The Engine's public API: the Run this crate drives, the effects and
# answers it correlates, and the run's VFS handle.
promptforge.workspace = true
# The run seed is drawn from the OS CSPRNG at preparation: it is the
# untrusted-envelope nonce's source, so it must be unguessable.
rand.workspace = true
serde_json.workspace = true
# The prompt's content hash for the run row, so a transcript can be
# matched to the exact text that produced it.
sha2.workspace = true
thiserror.workspace = true
# `rt` for the task-local scope `cancel` installs in; `cancel` is the one
# module that still names tokio.
tokio = { workspace = true, features = ["rt"] }
tokio-util.workspace = true
tracing.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# The scripted capabilities' tools and input brokers are `async_trait`
# traits.
async-trait.workspace = true
# The suites drive runs on tokio's test runtime, pace performers with its
# clock, and gate them with its semaphore and channels.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
