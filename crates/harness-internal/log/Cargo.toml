[package]
name = "harness-log"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge Harness run log: the append-only Turso record of every run's effects, answers, and events"
readme = "README.md"
keywords = ["promptforge", "llm", "agent", "harness", "log"]
categories = ["development-tools", "database"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
# The record values the log stores and returns, defined once beside the
# effect loop that produces them.
harness-runner.workspace = true
serde_json.workspace = true
thiserror.workspace = true
turso.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# The fidelity suite round-trips the Engine's events through the log.
promptforge.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
