# A per-crate clippy.toml replaces the workspace root's rather than merging
# with it, so the root's test allowances are restated here.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# The Harness polls every effect inside the run's own future and starts no
# task. `cargo test -p build-xtask` checks that every Harness crate names
# both methods. allow-invalid: this crate does not depend on tokio, so the
# paths do not resolve here; the ban must still be declared for the check.
disallowed-methods = [
    { path = "tokio::spawn", reason = "the Harness starts no task; poll the work inside the run's future", allow-invalid = true },
    { path = "tokio::task::spawn_blocking", reason = "the Harness starts no task; hand blocking work to the Host's runtime", allow-invalid = true },
]
