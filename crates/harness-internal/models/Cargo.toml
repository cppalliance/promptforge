[package]
name = "harness-models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge harness model client: the HTTP transport that performs the engine's Chat effects against the bound gateway"
readme = "README.md"
keywords = ["promptforge", "llm", "agent", "harness", "openai"]
categories = ["development-tools", "web-programming::http-client"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
# The performer trait the chat performer implements, and (in tests) the
# harness's one instrumented spawn wrapper the mock gateways run under.
harness-runner.workspace = true
# The engine's public API: the chat vocabulary (Message, ToolSchema, Completion,
# CompletionError) this transport exchanges with a Run's Chat effect, the
# SSE reassembly the streamed body is folded through, and the canonical
# metrics, model catalog, and delta vocabulary.
promptforge.workspace = true
# Names `bytes::Bytes`, the buffer `reqwest` yields per body chunk, as the
# reassembly's chunk type so no chunk is copied on its way in.
bytes.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The delta channel: `sync` for the sender a chat performer streams to;
# `time` for the per-receive timeout. Nothing here spawns; the runner does.
tokio = { workspace = true, features = ["sync", "time"] }
url.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
axum.workspace = true
# The end-to-end suite drives a prepared run through the effect loop with
# this crate's chat performer and reads the record stream back.
harness-log.workspace = true
# The tag fixture the mock gateways are spawned under.
harness-runner = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
