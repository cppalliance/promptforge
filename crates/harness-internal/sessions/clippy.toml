# A per-crate clippy.toml replaces the workspace root's rather than merging
# with it, so the root's test allowances are restated here.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# This crate spawns only through the wrappers in its `spawn` module, each
# the one permitted caller of the raw method it wraps.
# `cargo test -p build-xtask` checks that every Harness crate names both
# methods.
disallowed-methods = [
    { path = "tokio::spawn", reason = "spawn through this crate's `spawn` module" },
    { path = "tokio::task::spawn_blocking", reason = "spawn through this crate's `spawn` module" },
]
