[package]
name = "harness-sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge Harness sessions: agent discovery, session state, input waits, and the supervisor state machine behind the Harness public API"
readme = "README.md"
keywords = ["promptforge", "llm", "agent", "harness", "sessions"]
categories = ["development-tools", "api-bindings"]
documentation = "https://cppalliance.github.io/promptforge/"

[dependencies]
# The `InputBroker` trait is an `async_trait` trait.
async-trait.workspace = true
# The Host's capability registry and services the Harness hands every
# run, and the `InputBroker` trait and error vocabulary the session's
# input broker implements.
harness-capabilities.workspace = true
# The effect loop a session drives its runs through, run preparation,
# the recorder and inference broker seams a Host implements, and the
# instrumented spawn wrapper.
harness-runner.workspace = true
# The Engine's public API: the run context, the run limits, the events
# and deltas a session forwards, and the run's VFS handle.
promptforge.workspace = true
# Wait tokens and session ids are 128 bits from the OS CSPRNG:
# unguessable by anything that has not seen the announcing frame.
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `sync` for the supervisor's typed event queues (`mpsc`), the wait
# registry's `oneshot` and `broadcast` channels, and the session state
# watch.
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# The tag fixture the input tests spawn their waiting calls under.
harness-runner = { workspace = true, features = ["test-support"] }
# The discovery and session suites seed an agents directory on disk.
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
