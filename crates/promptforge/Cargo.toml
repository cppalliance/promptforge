[package]
name = "promptforge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge API: the one Engine crate that outside crates depend on to parse prompts and drive their runs"
documentation = "https://cppalliance.github.io/promptforge/promptforge/promptforge/index.html"

# Every crate that defines a re-exported item: each `pub use` names the
# defining crate's path.
[dependencies]
promptforge-engine.workspace = true
promptforge-lua.workspace = true
promptforge-model-client.workspace = true
promptforge-parser.workspace = true
promptforge-types.workspace = true
promptforge-vfs.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# The suite's and the `greeter` example's tool descriptors carry JSON
# parameter schemas, and the suite reads its effect and event logs back
# as JSON.
serde_json.workspace = true

[lints]
workspace = true
