[package]
name = "harness-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge promptforge/web capability: the web fetch tool and a search tool over the Host's search provider, in one pack a Host registers"
readme = "README.md"
keywords = ["promptforge", "llm", "tools", "web", "ssrf"]
categories = ["web-programming::http-client", "api-bindings"]
documentation = "https://cppalliance.github.io/promptforge/harness-web/harness_web/index.html"

[dependencies]
# The Harness public API: the capability, tool, and service vocabulary.
harness.workspace = true
# The Engine's public API: tool id, output, and error vocabulary.
promptforge.workspace = true
# `Tool` and `SearchProvider` are `async_trait` traits.
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["gzip", "brotli"] }
readabilityrs.workspace = true
htmd.workspace = true
mime.workspace = true
encoding_rs.workspace = true
url.workspace = true
ipnet.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The Host's runtime handle every fetch is spawned onto.
tokio = { workspace = true }
workspace-hack.workspace = true

[dev-dependencies]
axum.workspace = true
flate2.workspace = true
futures-util.workspace = true
# `io-util` is the `AsyncReadExt`/`AsyncWriteExt` the raw TCP mock reads
# its request and watches for the client's hang-up with.
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
