[package]
name = "promptforge-ws-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "PromptForge Workshop HTTP server: serves the workshop API to the desktop shell"

[[bin]]
name = "promptforge-ws-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
dunce.workspace = true
futures-util.workspace = true
# Optional: only the test-fixtures feature decodes the WAV voice fixtures.
hound = { workspace = true, optional = true }
open.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
whisper-rs.workspace = true

[features]
default = []
cuda = ["whisper-rs/cuda"]
# Compiles the crate-internal test fixtures and re-exports them to the
# integration-test binary; enabled for every test build by the self
# dev-dependency below, never by production consumers.
test-fixtures = ["dep:hound"]

[dev-dependencies]
# The crate dev-depends on itself so every test target - unit and
# integration alike - builds the library with test-fixtures enabled,
# without gate commands needing a --features flag.
promptforge-ws-server = { path = ".", features = ["test-fixtures"] }
tempfile.workspace = true
time = { workspace = true, features = ["parsing"] }
tokio-tungstenite.workspace = true
tower.workspace = true

[lints]
workspace = true
