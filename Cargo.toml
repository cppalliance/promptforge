[workspace]
resolver = "3"
members = [
    "crates/promptforge-core",
    "crates/promptforge-core-tests",
    "crates/promptforge-dev",
    "crates/promptforge-webfetch",
    "crates/promptforge-cli",
    "crates/promptforge-gateway",
    "crates/promptforge-mcp-server",
    "crates/promptforge-tool-picker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "BSL-1.0"

[workspace.dependencies]
promptforge-core = { path = "crates/promptforge-core", version = "0.1.0" }
promptforge-webfetch = { path = "crates/promptforge-webfetch", version = "0.1.0" }
promptforge-tool-picker = { path = "crates/promptforge-tool-picker", version = "0.1.0" }
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
fastrand = "2"
readabilityrs = "0.1"
htmd = "0.5"
mime = "0.3"
encoding_rs = "0.8"
url = "2"
ipnet = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
thiserror = "2"
anyhow = "1"
axum = "0.8"
async-trait = "0.1"
flate2 = "1"
futures-util = "0.3"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
# Pinned exactly: the `ServerHandler` surface has moved across minor releases,
# so an upgrade is a diff to read rather than a number to bump. `server` already
# implies `schemars`; both are named so a later feature edit cannot drop the
# schema derives by accident.
rmcp = { version = "=3.1.0", features = [
    "server",
    "schemars",
    "transport-streamable-http-server",
    "transport-io",
] }
tower = { version = "0.5", features = ["util"] }
arc-swap = "1"
glob = "0.3"
humantime = "2"
humantime-serde = "1"
notify = "8"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
hf-hub = { version = "1", features = ["blocking"] }
safetensors = "0.8"
sha2 = "0.11"
half = "2"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
# 0.22 rather than the newer 0.23 so the resolver unifies with the copy
# candle-core already pulls in, instead of compiling two. default-features off
# drops the progress bar and the C++ trainer; `onig` is the regex engine the
# runtime pre-tokenizers need, and is what candle-core selects too.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tar = { version = "0.4.46", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
indicatif = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
# Cherry-picked out of pedantic: it flags product names (PromptForge, OpenAI) in
# prose, which reads worse backticked than the lint is worth.
doc_markdown = "allow"
