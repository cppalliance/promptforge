[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "BSL-1.0"
repository = "https://github.com/cppalliance/promptforge"

[workspace.dependencies]
promptforge-core = { path = "crates/promptforge-core", version = "0.1.0" }
promptforge-core-support = { path = "crates/promptforge-core-support", version = "0.1.0" }
promptforge-desktop-shell = { path = "crates/promptforge-desktop-shell", version = "0.1.0" }
promptforge-gateway = { path = "crates/promptforge-gateway", version = "0.1.0" }
promptforge-gateway-build = { path = "crates/promptforge-gateway-build", version = "0.1.0" }
promptforge-gateway-client = { path = "crates/promptforge-gateway-client", version = "0.1.0" }
promptforge-gateway-config = { path = "crates/promptforge-gateway-config", version = "0.1.0" }
promptforge-gateway-local = { path = "crates/promptforge-gateway-local", version = "0.1.0" }
promptforge-gateway-protocol = { path = "crates/promptforge-gateway-protocol", version = "0.1.0" }
promptforge-gateway-routing = { path = "crates/promptforge-gateway-routing", version = "0.1.0" }
promptforge-lua = { path = "crates/promptforge-lua", version = "0.1.0" }
promptforge-parser = { path = "crates/promptforge-parser", version = "0.1.0" }
promptforge-progress = { path = "crates/promptforge-progress", version = "0.1.0" }
promptforge-store = { path = "crates/promptforge-store", version = "0.1.0" }
promptforge-webfetch = { path = "crates/promptforge-webfetch", version = "0.1.0" }
promptforge-tool-picker = { path = "crates/promptforge-tool-picker", version = "0.1.0" }
promptforge-tools = { path = "crates/promptforge-tools", version = "0.1.0" }
promptforge-transcribe = { path = "crates/promptforge-transcribe", version = "0.1.0" }
promptforge-web-search = { path = "crates/promptforge-web-search", version = "0.1.0" }
promptforge-web-search-service = { path = "crates/promptforge-web-search-service", version = "0.1.0" }
promptforge-workshop-server = { path = "crates/promptforge-workshop-server", version = "0.1.0" }
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
fastrand = "2"
rand = "0.9"
readabilityrs = "0.1"
htmd = "0.5"
mime = "0.3"
encoding_rs = "0.8"
url = "2"
# Percent-decoding for path parameters; already in the tree as url's own core.
percent-encoding = "2"
ipnet = "2"
dunce = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
thiserror = "2"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
# 0.29 rather than the newer 0.30 so the resolver unifies with the copy axum's
# `ws` feature already pulls in, instead of compiling two.
tokio-tungstenite = "0.29"
async-trait = "0.1"
flate2 = "1"
futures-util = "0.3"
mlua = { version = "0.12", features = ["lua55", "vendored", "serialize", "send"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
# The `ServerHandler` surface has moved across minor releases, so an upgrade is
# a diff to read rather than a number to bump: review the lockfile bump and run
# the tests before taking a new minor. `server` already implies `schemars`; both
# are named so a later feature edit cannot drop the schema derives by accident.
rmcp = { version = "3.1.0", features = [
    "server",
    "schemars",
    "transport-streamable-http-server",
    "transport-io",
] }
tower = { version = "0.5", features = ["util"] }
arc-swap = "1"
# Serves the workshop UI: reads ui/dist from disk in debug builds, embeds it
# into the binary in release builds.
rust-embed = "8"
glob = "0.3"
humantime = "2"
humantime-serde = "1"
notify = "8"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
hf-hub = { version = "1", features = ["blocking"] }
safetensors = "0.8"
sha2 = "0.11"
subtle = "2.6"
half = "2"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
dotenvy = "0.15"
# 0.22 rather than the newer 0.23 so the resolver unifies with the copy
# candle-core already pulls in, instead of compiling two. default-features off
# drops the progress bar and the C++ trainer; `onig` is the regex engine the
# runtime pre-tokenizers need, and is what candle-core selects too.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tar = { version = "0.4.46", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
indicatif = "0.18"
# Safe bindings to whisper.cpp; the C++ core is built from source by
# whisper-rs-sys (cmake + MSVC required). Enable promptforge-transcribe's
# "cuda" feature (via the ws-server's "voice-cuda") to build with GPU
# acceleration (needs the CUDA Toolkit).
whisper-rs = "0.16"
# WAV parsing for the voice test fixtures; optional dependency of
# promptforge-transcribe's test-fixtures feature.
hound = "3.5"
socket2 = { version = "0.6", features = ["all"] }
# Host metrics for `GET /admin/system`. default-features off keeps only the
# CPU/RAM (`system`) and disk probes; the component, network, and user
# probes and the rayon-backed `multithread` refresh are never used.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
# GPU name and VRAM for `GET /admin/system`. Loads NVML dynamically at
# runtime via libloading, so machines without an NVIDIA driver degrade to an
# absent GPU field rather than a link failure.
nvml-wrapper = "0.12"
# wry 0.56 pairs with tao 0.36 (wry's own dev-dependency constraint); tao 0.37
# is newer but untested against this wry.
wry = "0.56"
tao = "0.36"
# Opens a URL in the system browser for the windowless server frame.
open = "5"
# Decodes the bundled program-icon PNG into RGBA for the tao window icon.
png = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
# Cherry-picked out of pedantic: it flags product names (PromptForge, OpenAI) in
# prose, which reads worse backticked than the lint is worth.
doc_markdown = "allow"
