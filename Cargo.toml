[workspace]
resolver = "3"
members = ["crates/promptforge-core", "crates/promptforge-cli", "crates/promptforge-gateway"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
promptforge-core = { path = "crates/promptforge-core", version = "0.1.0" }
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
readabilityrs = "0.1"
htmd = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
thiserror = "2"
axum = "0.8"
async-trait = "0.1"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
time = { version = "0.3", features = ["formatting"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "warn"
# Cherry-picked out of pedantic: it flags product names (PromptForge, OpenAI) in
# prose, which reads worse backticked than the lint is worth.
doc_markdown = "allow"
