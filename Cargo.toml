[workspace]
resolver = "3"
members = ["crates/*", "crates/promptforge-internal/lua", "crates/promptforge-internal/parser", "crates/promptforge-internal/store", "crates/promptforge-internal/vfs", "crates/promptforge-internal/model-client", "crates/gateway/app", "crates/gateway/cloud-providers", "crates/gateway/config", "crates/gateway/config-ui", "crates/gateway/local", "crates/gateway/logging", "crates/gateway/progress", "crates/gateway/protocol", "crates/gateway/routing", "crates/gateway/web-search", "crates/gateway/stt/api", "crates/gateway/stt/engine", "crates/gateway/stt/backend-whisper", "crates/gateway/stt/whisper-ffi", "crates/workshop/shell", "crates/workshop/server", "crates/workshop/server-api", "crates/workshop/gateway", "crates/workshop/menu", "crates/workshop/protocol", "crates/workshop/registry", "crates/workshop/status", "crates/workshop/support", "crates/workshop/user-state", "crates/workshop/workspace", "crates/harness/runner", "crates/harness/models", "crates/harness/capabilities", "crates/harness/log", "crates/harness/sessions", "crates/harness/web", "crates/harness/webfetch", "crates/harness/web-search"]
# crates/shared-ui is not a Rust crate: it is the shared TypeScript+CSS
# package both esbuild-built UIs consume, so the crates/* glob skips it.
# crates/promptforge-internal, crates/gateway, crates/workshop, and
# crates/harness are manifestless containers holding their families' private
# crates (the gateway's STT subsystem nests one level deeper under
# crates/gateway/stt).
# Cargo prunes excluded subtrees from member globs, so a "crates/gateway/*"
# glob beside the exclude below would match nothing; the container crates
# are enumerated explicitly instead.
exclude = ["crates/shared-ui", "crates/promptforge-internal", "crates/gateway", "crates/gateway/stt", "crates/workshop", "crates/harness"]
# Plain `cargo build`/`cargo test` build only the gateway: it compiles on a
# fresh macOS or Linux clone with no CUDA toolkit and no Tauri system
# packages. The desktop app is an explicit choice:
# `cargo build -p workshop`.
default-members = ["crates/gateway/app"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "BSL-1.0"
repository = "https://github.com/cppalliance/promptforge"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
promptforge = { path = "crates/promptforge", version = "0.3.0" }
promptforge-api-runtime = { path = "crates/promptforge-api-runtime", version = "0.3.0" }
promptforge-api-types = { path = "crates/promptforge-api-types", version = "0.3.0" }
gateway-api-types = { path = "crates/gateway-api-types", version = "0.3.0" }
gateway-cloud-providers = { path = "crates/gateway/cloud-providers", version = "0.3.0" }
gateway = { path = "crates/gateway/app", version = "0.3.0" }
gateway-config = { path = "crates/gateway/config", version = "0.3.0" }
gateway-config-ui = { path = "crates/gateway/config-ui", version = "0.3.0" }
gateway-local = { path = "crates/gateway/local", version = "0.3.0" }
gateway-logging = { path = "crates/gateway/logging", version = "0.3.0" }
shared-error-source = { path = "crates/shared-error-source", version = "0.3.0" }
shared-loopback = { path = "crates/shared-loopback", version = "0.3.0" }
gateway-protocol = { path = "crates/gateway/protocol", version = "0.3.0" }
gateway-api-discovery = { path = "crates/gateway-api-discovery", version = "0.3.0" }
harness-api = { path = "crates/harness-api", version = "0.3.0" }
harness-runner = { path = "crates/harness/runner", version = "0.3.0" }
harness-models = { path = "crates/harness/models", version = "0.3.0" }
harness-capabilities = { path = "crates/harness/capabilities", version = "0.3.0" }
harness-log = { path = "crates/harness/log", version = "0.3.0" }
harness-sessions = { path = "crates/harness/sessions", version = "0.3.0" }
harness-web = { path = "crates/harness/web", version = "0.3.0" }
harness-webfetch = { path = "crates/harness/webfetch", version = "0.3.0" }
harness-web-search = { path = "crates/harness/web-search", version = "0.3.0" }
shared-vfs = { path = "crates/shared-vfs", version = "0.3.0" }
gateway-routing = { path = "crates/gateway/routing", version = "0.3.0" }
promptforge-lua = { path = "crates/promptforge-internal/lua", version = "0.3.0" }
promptforge-model-client = { path = "crates/promptforge-internal/model-client", version = "0.3.0" }
promptforge-parser = { path = "crates/promptforge-internal/parser", version = "0.3.0" }
gateway-progress = { path = "crates/gateway/progress", version = "0.3.0" }
gateway-stt = { path = "crates/gateway/stt/api", version = "0.3.0" }
promptforge-store = { path = "crates/promptforge-internal/store", version = "0.3.0" }
promptforge-vfs = { path = "crates/promptforge-internal/vfs", version = "0.3.0" }
gateway-stt-engine = { path = "crates/gateway/stt/engine", version = "0.3.0" }
gateway-stt-backend-whisper = { path = "crates/gateway/stt/backend-whisper", version = "0.3.0" }
gateway-web-search = { path = "crates/gateway/web-search", version = "0.3.0" }
workshop-server = { path = "crates/workshop/server", version = "0.3.0" }
workshop-server-api = { path = "crates/workshop/server-api", version = "0.0.0" }
workshop-gateway = { path = "crates/workshop/gateway", version = "0.0.0" }
workshop-menu = { path = "crates/workshop/menu", version = "0.0.0" }
workshop-protocol = { path = "crates/workshop/protocol", version = "0.0.0" }
workshop-status = { path = "crates/workshop/status", version = "0.0.0" }
workshop-support = { path = "crates/workshop/support", version = "0.0.0" }
workshop-registry = { path = "crates/workshop/registry", version = "0.0.0" }
workshop-workspace = { path = "crates/workshop/workspace", version = "0.0.0" }
workshop-user-state = { path = "crates/workshop/user-state", version = "0.0.0" }
gateway-whisper-ffi = { path = "crates/gateway/stt/whisper-ffi", version = "0.3.0" }
# cargo-hakari's feature-unification crate; every member inherits it.
workspace-hack = { path = "crates/workspace-hack", version = "0.1" }
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
# `float_roundtrip` makes `from_str` reproduce the exact `f64` that
# `to_string` printed, so a payload the run log stores reads back bit-for-bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
# 0.13 rather than 0.12 so the tree links exactly one rustls crypto backend:
# aws-lc-rs, the one Tauri already selects. 0.13 has no `ring`
# option, so a bump cannot re-enable it; CI checks that `ring` stays out of
# the gateway's normal closure. Root certificates come from the OS trust
# store through the platform verifier (the `rustls` feature's default), not
# from a bundled Mozilla list. `query` became opt-in in 0.13.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
fastrand = "2"
rand = "0.9"
readabilityrs = "0.1"
htmd = "0.5"
mime = "0.3"
encoding_rs = "0.8"
url = "2"
# Percent-decoding for path parameters; already in the tree as url's own core.
percent-encoding = "2"
ipnet = "2"
dunce = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
# default-features off: the `sync` module (CancellationToken) is ungated in
# tokio-util 0.7, so no features are required for it.
tokio-util = { version = "0.7", default-features = false }
thiserror = "2"
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "ws"] }
# 0.29 rather than the newer 0.30 so the resolver unifies with the copy axum's
# `ws` feature already pulls in, instead of compiling two.
tokio-tungstenite = "0.29"
async-trait = "0.1"
flate2 = "1"
futures-util = "0.3"
mlua = { version = "0.12", features = ["lua55", "vendored", "serialize", "send"] }
# 1.x rather than 0.8 so the resolver unifies with the copy tauri-utils
# already pulls in, instead of compiling two toml lines (and the 0.8 line's
# exclusive toml_edit 0.19 and winnow 0.5 tail).
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tower = { version = "0.5", features = ["util"] }
arc-swap = "1"
# Serves the UIs: reads $OUT_DIR/ui-dist from disk in debug builds, embeds it
# into the binary in release builds. interpolate-folder-path resolves the
# $OUT_DIR prefix in the `folder` attribute.
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
glob = "0.3"
humantime = "2"
humantime-serde = "1"
notify = "8"
tempfile = "3"
# Exact pin: turso is pre-1.0 and backs user-visible workspace files, so
# upgrades are deliberate, reviewed changes rather than resolver drift.
# default-features off: the `mimalloc` default installs a
# `#[global_allocator]` from inside the library (process-global state and a
# C build in a serve path), and `fts` is unused; the workspace schema is
# three plain tables.
turso = { version = "=0.7.2", default-features = false }
time = { version = "0.3", features = ["formatting"] }
sha2 = "0.11"
hmac = "0.13"
subtle = "2.6"
dotenvy = "0.15"
tar = { version = "0.4.46", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
# Loads the packaged whisper.cpp runtime without linking it into Cargo builds.
libloading = "0.8"
# WAV parsing for STT uploads and transcription test fixtures.
hound = "3.5"
socket2 = { version = "0.6", features = ["all"] }
# Host metrics for `GET /admin/system`. default-features off keeps only the
# CPU/RAM (`system`) and disk probes; the component, network, and user
# probes and the rayon-backed `multithread` refresh are never used.
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }
# GPU name and VRAM for `GET /admin/system`. Loads NVML dynamically at
# runtime via libloading, so machines without an NVIDIA driver degrade to an
# absent GPU field rather than a link failure.
nvml-wrapper = "0.12"
# Opens a URL in the system browser for the windowless server frame.
open = "5"
# The Linux tray backend: a pure StatusNotifierItem over D-Bus, no GTK.
# default-features off drops ksni's tokio feature; async-io runs the service
# on ksni's own executor thread, so the tray never depends on which runtime
# polls it (the tokio feature's runtime coupling is the documented panic
# class). 0.3.6 is the floor for assume_sni_available and watcher
# re-registration.
ksni = { version = "0.3.6", default-features = false, features = ["async-io"] }
# The session-bus probes beside ksni (watcher presence, the first-run
# notification); the same zbus major ksni builds on, on the same async-io
# executor model.
zbus = { version = "5", default-features = false, features = ["async-io"] }
# The gateway's system tray on Windows and macOS.
# 0.24.1+ is required: it re-registers the icon on TaskbarCreated and keeps
# a hidden icon hidden across Explorer restarts.
tray-icon = "0.24.1"
# The macOS tray backend: the NSApplication run loop owns the main thread and
# SMAppService backs Launch at Login. objc2 is the maintained successor to the
# objc crate family; the framework crates are feature-gated per class so the
# build links only what the backend uses.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    # setActivationPolicy and NSApplicationActivationPolicy live behind the
    # NSRunningApplication feature (they are declared in its header).
    "NSRunningApplication",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSTimer",
    # The block-based NSTimer initializer is gated on NSDate + block2.
    "NSDate",
    "block2",
    # NSProcessInfo.operatingSystemVersion gates SMAppService to macOS 13+.
    "NSProcessInfo",
] }
objc2-service-management = { version = "0.3", default-features = false, features = [
    "std",
    # The SMAppService class binding is a per-class feature.
    "SMAppService",
    "objc2",
    "objc2-foundation",
] }
block2 = "0.6"
# Thin process-image shims for gateway-api-discovery's stale detection; both are
# already in the tree transitively.
libc = "0.2"
windows-sys = { version = "0.61", default-features = false }
# Cross-platform console interruption for the Workshop build orchestrator.
ctrlc = "3.5"
# Benchmark harness for the executor and Lua-boundary benches; dev-only.
criterion = "0.5"
# Compiles the gateway exe's Windows icon resource in its build script;
# already in the tree through tauri-build (via tauri-winres).
embed-resource = "3"
# Encodes PNG fixtures in the gateway's integration tests.
png = "0.18"
# Tauri v2 desktop framework for workshop. tauri is pinned to the
# minor because `with_webview` exposes webview2-com/webkit2gtk types that may
# shift in a Tauri minor release (the upstream guidance for `with_webview`).
tauri = "~2.11"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2.3.1"
# default-features off drops the plugin's `rustls-tls` default, which is the
# one dependency in the tree that pins rustls to the `ring` backend (and
# installs it as the process-global CryptoProvider). Through workspace-hack
# that feature would put `ring` back into every member, the gateway included.
# The plugin's reqwest calls still get TLS: cargo unifies reqwest's features
# per binary and the workspace pin above enables `rustls` (aws-lc-rs), so the
# Workshop links one crypto backend. `system-proxy` and `zip` are the
# plugin's other defaults, kept as they were.
tauri-plugin-updater = { version = "2.11.0", default-features = false, features = ["system-proxy", "zip"] }
tauri-plugin-single-instance = "2.4.4"
# Test-only Jinja2 compatibility oracle for bundled chat templates. Members
# inherit these only from their dev-dependency tables.
minijinja = { version = "2.24", default-features = false, features = [
    "builtins",
    "debug",
    "deserialization",
    "macros",
    "multi_template",
    "preserve_order",
    "serde",
    "std_collections",
] }
minijinja-contrib = { version = "2.24", default-features = false, features = ["pycompat"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
# Cherry-picked out of pedantic: it flags product names (PromptForge, OpenAI) in
# prose, which reads worse backticked than the lint is worth.
doc_markdown = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
