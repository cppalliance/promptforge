[workspace]
resolver = "3"
members = ["crates/*"]
# Plain `cargo build`/`cargo test` build only the gateway: it compiles on a
# fresh macOS or Linux clone with no CUDA toolkit and no Tauri system
# packages. The desktop app is an explicit choice:
# `cargo build -p workshop`.
default-members = ["crates/gateway"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "BSL-1.0"
repository = "https://github.com/cppalliance/promptforge"

[workspace.dependencies]
promptforge = { path = "crates/promptforge", version = "0.2.0" }
promptforge-core = { path = "crates/promptforge-core", version = "0.2.0" }
promptforge-core-support = { path = "crates/promptforge-core-support", version = "0.2.0" }
gateway = { path = "crates/gateway", version = "0.2.0" }
gateway-config = { path = "crates/gateway-config", version = "0.2.0" }
gateway-config-ui = { path = "crates/gateway-config-ui", version = "0.2.0" }
gateway-local = { path = "crates/gateway-local", version = "0.2.0" }
gateway-loopback = { path = "crates/gateway-loopback", version = "0.2.0" }
gateway-protocol = { path = "crates/gateway-protocol", version = "0.2.0" }
gateway-routing = { path = "crates/gateway-routing", version = "0.2.0" }
promptforge-lua = { path = "crates/promptforge-lua", version = "0.2.0" }
promptforge-model-client = { path = "crates/promptforge-model-client", version = "0.2.0" }
promptforge-parser = { path = "crates/promptforge-parser", version = "0.2.0" }
shared-progress = { path = "crates/shared-progress", version = "0.2.0" }
gateway-stt = { path = "crates/gateway-stt", version = "0.2.0" }
promptforge-store = { path = "crates/promptforge-store", version = "0.2.0" }
promptforge-webfetch = { path = "crates/promptforge-webfetch", version = "0.2.0" }
promptforge-tool-picker = { path = "crates/promptforge-tool-picker", version = "0.2.0" }
promptforge-tools = { path = "crates/promptforge-tools", version = "0.2.0" }
gateway-transcribe = { path = "crates/gateway-transcribe", version = "0.2.0" }
promptforge-web-search = { path = "crates/promptforge-web-search", version = "0.2.0" }
gateway-web-search = { path = "crates/gateway-web-search", version = "0.2.0" }
workshop-server = { path = "crates/workshop-server", version = "0.2.0" }
gateway-whisper-ffi = { path = "crates/gateway-whisper-ffi", version = "0.2.0" }
promptforge-agent = { path = "crates/promptforge-agent", version = "0.2.0" }
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
fastrand = "2"
rand = "0.9"
readabilityrs = "0.1"
htmd = "0.5"
mime = "0.3"
encoding_rs = "0.8"
url = "2"
# Percent-decoding for path parameters; already in the tree as url's own core.
percent-encoding = "2"
ipnet = "2"
dunce = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
# default-features off: the `sync` module (CancellationToken) is ungated in
# tokio-util 0.7, so no features are required for it.
tokio-util = { version = "0.7", default-features = false }
thiserror = "2"
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "ws"] }
# 0.29 rather than the newer 0.30 so the resolver unifies with the copy axum's
# `ws` feature already pulls in, instead of compiling two.
tokio-tungstenite = "0.29"
async-trait = "0.1"
flate2 = "1"
futures-util = "0.3"
mlua = { version = "0.12", features = ["lua55", "vendored", "serialize", "send"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
tower = { version = "0.5", features = ["util"] }
arc-swap = "1"
# Serves the UIs: reads $OUT_DIR/ui-dist from disk in debug builds, embeds it
# into the binary in release builds. interpolate-folder-path resolves the
# $OUT_DIR prefix in the `folder` attribute.
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
glob = "0.3"
humantime = "2"
humantime-serde = "1"
notify = "8"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
hf-hub = { version = "1", features = ["blocking"] }
safetensors = "0.8"
sha2 = "0.11"
subtle = "2.6"
half = "2"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
dotenvy = "0.15"
# 0.22 rather than the newer 0.23 so the resolver unifies with the copy
# candle-core already pulls in, instead of compiling two. default-features off
# drops the progress bar and the C++ trainer; `onig` is the regex engine the
# runtime pre-tokenizers need, and is what candle-core selects too.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tar = { version = "0.4.46", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
indicatif = "0.18"
# Loads the packaged whisper.cpp runtime without linking it into Cargo builds.
libloading = "0.8"
# WAV parsing for STT uploads and transcription test fixtures.
hound = "3.5"
socket2 = { version = "0.6", features = ["all"] }
# Host metrics for `GET /admin/system`. default-features off keeps only the
# CPU/RAM (`system`) and disk probes; the component, network, and user
# probes and the rayon-backed `multithread` refresh are never used.
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }
# GPU name and VRAM for `GET /admin/system`. Loads NVML dynamically at
# runtime via libloading, so machines without an NVIDIA driver degrade to an
# absent GPU field rather than a link failure.
nvml-wrapper = "0.12"
# Opens a URL in the system browser for the windowless server frame.
open = "5"
# Encodes PNG fixtures in the gateway's integration tests.
png = "0.18"
# Tauri v2 desktop framework for workshop. tauri is pinned to the
# minor because `with_webview` exposes webview2-com/webkit2gtk types that may
# shift in a Tauri minor release (the docs.rs guidance for `with_webview`).
tauri = "~2.11"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.11.0"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-single-instance = "2.4.4"
# Test-only Jinja2 compatibility oracle for bundled chat templates. Members
# inherit these only from their dev-dependency tables.
minijinja = { version = "2.24", default-features = false, features = [
    "builtins",
    "debug",
    "deserialization",
    "macros",
    "multi_template",
    "preserve_order",
    "serde",
    "std_collections",
] }
minijinja-contrib = { version = "2.24", default-features = false, features = ["pycompat"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
# Cherry-picked out of pedantic: it flags product names (PromptForge, OpenAI) in
# prose, which reads worse backticked than the lint is worth.
doc_markdown = "allow"

# Published members opt in below their package metadata. Keep semver-checks
# policy centralized here as the workspace grows.
[workspace.metadata.cargo-semver-checks.lints]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
