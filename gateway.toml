# PromptForge gateway - development profile.
# The single endpoint is Anthropic's OpenAI-compatible endpoint. The gateway
# holds the vendor key; the executor only knows this gateway's URL and key.

[server]
bind = "127.0.0.1:8081"
key = "${PROMPTFORGE_GATEWAY_KEY}"

[queue]
max_depth = 100
fair_scheduling = true

[[endpoint]]
id = "anthropic"
protocol = "openai"
base_url = "https://api.anthropic.com/v1"
api_key = "${ANTHROPIC_API_KEY}"
concurrency = 10

[[model]]
name = "claude-sonnet-4-6"
description = "A model suited for careful analysis, coding, and general assistance"
context = 200000
thinking = "never"
upstream = "claude-sonnet-4-6"
endpoints = ["anthropic"]

# The web_search tool proxies through the gateway so the Brave key stays here,
# never in the executor. web_fetch runs locally in the executor and needs no
# gateway configuration.
[tools.web_search]
provider = "brave"
api_key = "${BRAVE_API_KEY}"
