# PromptForge gateway - development profile.
# The single endpoint is Anthropic's OpenAI-compatible endpoint. The gateway
# holds the vendor key; the executor only knows this gateway's URL and token.

[server]
bind = "127.0.0.1:8081"
token = "${PROMPTFORGE_TOKEN}"

[[endpoint]]
id = "anthropic"
protocol = "openai"
base_url = "https://api.anthropic.com/v1"
api_key = "${ANTHROPIC_API_KEY}"

[[model]]
name = "claude-sonnet-4-6"
upstream = "claude-sonnet-4-6"
endpoints = ["anthropic"]
